body:
  text: 蜀渝華巖季而關聖可德玉順硃雪堂行和尚住薦福一日問暫到僧甚處來僧云福州來雪堂云沿路見好長老麼僧云近過信州博山住持本和尚雖不曾拜識好長老也雪堂曰安得知其為好僧云入寺路徑開闢廊廡修整殿堂香燈不絶晨昏鐘鼓分明二時粥飯精潔僧行見人有禮以此知其為好長老雪堂笑曰本固賢矣然爾亦具眼也直以斯言達于郡守吳公傅朋曰遮僧持論頗類范延齡薦張希顏事而閣下之賢不減張忠定公老僧年邁乞請本住持庶幾為林下盛事吳公大喜本即日遷薦福東湖集范延齡事出皇朝類苑雪堂名道行佛眼遠嗣也沿循也博山本名悟本大慧之嗣也信州廣信府也庶幾近辭閣下語録宰相三公郡守俱稱閣下也雪堂和尚住饒州薦福寺時將辭院欲擇賢以繼也一日問新到僧從何處來僧云福州來堂又問曰循路而來曾見有好長老否僧進云近過信州博山悟本和尚雖不曾參拜他知是個好長老也雪堂更問之曰以何緣故而知他是個好長老也僧進云有六樁好事而知其為好也第一入寺路徑開闢居處好第二廊廡修整建立好第三殿堂香燈不絶報恩好第四鐘鼓分明法令好第五粥飯精潔恩衆好第六僧行見人有禮規矩好以此六樁好事知其為好長老也雪堂心悅而笑曰本長老固是有德而爾亦具識賢之眼也遂專以此擇賢機緣通於饒州郡守吳公傅朋曰這僧抵對持論略同范延齡奉命押兵過金陵金陵守張詠問齡沿路見好官麼齡曰昨過萍鄉縣張希顏好官也詠曰何以知其好齡曰入境見橋路完美田園開闢野無惰農市無賭博夜聞更鼓分明必有美政者詠曰希顏固賢天使亦好官員即日同薦於朝正與此個故事一樣而閣下之賢不在張忠定公之下矣老僧年老祈吳公請本繼此住持方近為叢林美事吳公深喜即日差請本即日遷薦福此乃叢林選賢繼住之法要也雪堂曰金隄千里潰於蟻壤白璧之美離於瑕玷況無上妙道非特金隄白璧也而貪欲瞋恚非特蟻壤瑕玷也要在志之端謹行之精進守之堅確修之完美然後可以自利而利他也金只作鐵字看取堅固之意隄河岸也潰漏也壤非宜蠰土螽也又召蠰溪種類雖小最多比況三毒的意思雪堂示學人志端行力守堅修美之要說學道的人志行要極堅固譬如生鐵鑄就的隄岸一般蟻蠰才沒奈他何若是土沙他種類又多人不打點止塞有時被他鑽漏了那能堅固守修又要無染譬如美好清潤的白璧一般瑕玷一絲毫也沒有若是有一毛頭許人便捨離他而不愛了那得無染呪此無上妙道非特金隄白璧之可比也而貪欲瞋恚又非特蟻蠰瑕玷之可喻也學道者貴在立志端正敬謹力行勇猛精進保守堅卓確實操修完全美好如此方才可以調伏己情而守護他意也雪堂曰豫在龍門時昺鐵面住太平有言昺行腳離鄉未久聞受業一夕遺火悉為煨燼昺得書擲之於地乃曰徒亂人意耳東湖集煨燼言燒至熄無有也雪堂借往事以勵學人當篤志參禪說豫在舒州龍門的時候昺鐵面住太平有人說昺為人好道篤實初行腳離家不多時聞他受業常住一日失火燒得一毫也無有人持書與昺昺接得不看拋棄在地而言曰徒亂人意耳如此篤志實為希有雪堂謂晦菴光和尚曰豫弱冠之年見獨居士言中無主不立外不正不行此語宜終身踐之聖賢事業備矣豫佩其語在家修身出家學道以至率身臨衆如衡石之定重輕規矩之成方圓捨此則事事失準矣晦菴名惠光住信州龜峯雪堂行機嗣也弱冠二十餘歲也獨居士廣録云即雪堂之父佩帶也準法則也雪堂謂晦菴聖賢事業貴中正說豫二十餘弱冠之年曾見獨居士有言胸中無主宰的事決定不要立他外面不端正的事決定不要行他此二語宜盡一生履踐之為聖為賢的事業盡備於斯矣豫常佩帶此語在家之時以修養我身出家之時以進學斯道及至出世之時率身以臨廣衆譬如等稱之較輕重墨斗曲尺之為方圓一般捨此二語則頭頭法法咸差失而無法則也雪堂曰高菴臨衆必曰衆中須知有識者豫因問其故高菴曰不見溈山道舉措看他上流莫謾隨於庸鄙平生在衆不沈於下愚者皆出此語稠人廣衆中鄙者多識者少鄙者易習識者難親果能自奮志於其間如一人與萬人敵庸鄙之習力盡真挺特沒量漢也豫終身踐其言始得不負出家之志廣録謾且也挺超拔也特挺立曰特沒量漢猶言大丈夫的意思雪堂勵學人當依效有見識好人說高菴臨蒞大衆必曰稠人廣衆中定有好人豫因問何故而知之高菴答豫曰不見溈山有言動止看他上流好人莫且隨于下愚庸鄙我一生在大衆中不墮入于下愚者皆得此兩語之力也稠人羣居廣衆雜處其中也有不學好的鄙人甚多也有識見高妙的人却又少鄙人易得習學好人又難得親近須是各人自己有個主見果能自己奮發大志於其間譬如一人奮勇雄入九軍之中與萬人抵敵一般使下愚習染必力斬斷盡淨無餘這才教做真正挺然出類特然拔萃的大丈夫也高菴答我此言豫平生依之踐履始得如法修行不孤負我出家一番的志向雪堂謂且菴曰執事須權重輕發言要先思慮務合中道勿使偏頗若倉卒暴用鮮克有濟就使得成而終不能萬全豫在衆中備見利病惟有德者以寬服人常願後來有志力者審而行之方為美利靈源嘗曰凡人平居內照多能曉了及涉事外馳便乖混融喪其法體必欲思紹佛祖之任啓迪後昆不可不常自檢責也且菴名守仁雪堂行之嗣也偏頗不正也啓迪開發也檢檢束也責剋責也雪堂謂且菴審言察行當合中道說荷法之人用執事須稱量當重與重當輕與輕發言時必先要思而又思慮而又慮專務合中勿使不正若是急遽猛用少能有濟設使略得成就而究竟必不能保其一一全美豫在稠人中曾經見此利害備曉此斃病惟有德賢人以寬之德感服于人常願後來有大志有才力者詳審而行之方才美好與人有益靈源嘗曰凡人燕居獨處時攝心內照一個也是曉然明了及乎經涉事物向外馳應便不能混合融通喪失清淨法體若果有大乘根器必欲思擔荷佛祖慧命之任開發緇素本具之理不可不常常自檢束其身剋責其心也應菴華和尚住明果雪堂未嘗一日不過從間有竊議者雪堂曰華侄為人不悅利近名不先譽後毀不阿容苟合不色巧言加以見道明白去住翛然衲子難得豫固重之且菴逸事應菴名曇華虎丘隆祖之嗣也應菴住明果時雪堂日日過從衲子中間有私論道堂為叔長不宜屈尊雪堂乃曉之曰華姪此人行履端正不喜財利不慕聲名不誇好於先而毀訾於後不阿諛取容以苟且和合不顏色不巧好語言更加以見徹道理了然明白出處去就脫灑翛然衲子之中不易得者豫故日日過從而尊重之雪堂曰學者氣勝志則為小人志勝氣則為端人正士氣與志齊為得道賢聖有人剛狠不受規諫氣使然也端正之士雖強使為不善寧死不二志使然也氣稟氣也志心之所之也季而謂氣即力用也志即道體也雪堂示人氣志不可偏說學者有力用而乏道體是有用而無體也專逞才力必為壞事的小人有道體而乏力用是有體而無用也雖不能幹事益人亦可作端人正士力用與道體二者全備則為有德之賢得道之聖有人性情剛強狠戾不受揵椎教訓者力用之氣使之然也端正的人雖勉強教他行惡至于死地他也是不遷不變不二其心的道體之志使之然也欲為聖為賢者志氣豈可偏乎雪堂曰高菴住雲居普雲圓為首座一材僧為書記白楊順為藏主通烏頭為知客賢真牧為維那華侄為副寺用侄為監寺皆是有德業者用侄尋常廉約不點常住油華侄因戲之曰異時做長老須是鼻孔端正始得豈可以此為得耶用侄不對用侄處己雖儉與人甚豐接納四來略無倦色高菴一日見之曰監寺用心固難得更須照管常住勿令疏失用侄曰在某失為小過在和尚尊賢待士海納山容不問細微誠為大德高菴笑而已故叢林有用大碗之稱逸事普雲圓名自圓高菴善悟之嗣一材僧水菴之嗣白楊名法順佛眼之嗣也烏頭名法通長蘆了清之嗣真牧名正雪佛眼之嗣用侄雙林德用高菴之嗣雪堂舉高菴得人之盛以曉後主法者說高菴得人可謂盛矣當住雲居之時表率叢林開發後學則有普雲圓首座焉執掌文翰山門書疏則有一材僧書記焉執掌經典粘補損蠧則有白楊順藏主焉知典賓客應接香茶則有通烏頭知客焉綱維大衆曲盡調攝則有賢真牧維那焉執掌錢米隨時支用則有華侄副寺焉勤事香火應接官員則有用侄監寺焉如是般名員皆是大乘根器有德業者用侄尋常處己清廉儉約不費點常住油燈時華侄因相戲謔而言曰他日為人做長老須是鼻孔端莊正直方才教做得豈可以今日不點常住油就教做得也耶恐儞那時不及今時也用侄總不抵對用侄為人于自己雖然儉約而與人却又甚豐接納四方之來毫無一點疲厭之色高菴一日見之乃曰監寺如此用心本不易得更當照了管攝常住大小事物莫使踈漏差失用侄答之曰在德用設有差悟其過猶小在和尚能尊崇有德之人優待有道之士如海之納如山之容不問瑣末細事誠為大德高菴見他說得甚當乃笑而已故叢林中有用大碗的混名可謂不虗稱矣雪堂曰學者不知道之所向則尋師友以參扣之善知識不可以道之獨化故假學者贊祐之是以主招提有道德之師而成法社必有賢智之衲子是為虎嘯風冽龍驤雲起昔江西馬祖因百丈南泉而顯其大機大用南嶽石頭得藥山天皇而著其大智大能所以千載一合論說無疑翼然若鴻毛之遇風沛乎似巨魚之縱壑皆自然之勢也遂致建叢林功勳增佛祖光耀先師住龍門一夕謂豫曰我無德業不能浩歸湖海衲子終愧老東山也言畢潸然豫嘗思之今為人師法者與古人相去倍萬矣與竹菴書贊佑佐助也嘯蹙口出聲也冽寒氣嚴貌驤馬低昂騰躍也虎嘯龍驤總是比況得人而道行的意思藥山名惟儼天皇名道悟俱石頭希遷嗣也翼然羽翼舒展也鴻雁之大者沛霈同沛然下雨也言巨魚噴沫成雨也潸然涕淚流也雪堂執古御今以曉為人師者當以得人為重說學人不知此理何所趣向則撥草瞻風尋明師問良友以參扣之王法者不可以此理一人獨專故獎賢育德量才能請執事以助佑之是以主持招提有達理涵德之宗師而成立法席必有賢良智慧之衲子主法得人學者得師兩相契會是為同聲相應而虎嘯風生同氣相求而龍驤雲起師資契會大類乎此昔江西馬駒踏殺天下人因得百丈海南泉願而顯發其大機大用南嶽石頭路滑因得藥山儼天皇悟而彰著其大智大能所以千載奇逢一朝契合議論談說言下無疑譬如大鵬展趐而遇颶風一般又似鯤鯨出壑而逢雱霈一樣此皆自然之勢非勉強如斯也江西南嶽得人之盛是這等樣遂使建樹叢林功勛不小增添佛祖光耀亦大豈偶然哉先師住舒州龍門一夕語豫言我無德行道業不能浩浩然如水之就下致歸五湖四海衲子究竟慙恧不及老東山演祖也言畢潸焉出涕豫嘗思先輩以觀今日之為人天師表法則者較比古人豈止千里之遠耶萬倍之遠矣雪堂曰豫任龍門時靈源住太平有司以非意擾之靈源與先師書曰直可以行道殆不可為枉可以住持誠非我志不如放意於千巖萬壑之間日飽芻粟以遂餘生復何惓惓乎不旬浹間有黃龍之命乃乘興歸江西聰首座記聞芻粟草子米也惓宜眷反顧也旬浹甲一周曰旬辰一周曰浹雪堂曉住持人要知機括識去就說豫昔在舒州龍門時靈源住持太平寺地方官以非禮之事相攪擾靈源與先師書云直心直行乃可以行道然不可作為曲體曲就却可以住持又不是我的志向不如放肆身心于至高至深之處日食草子以樂殘年復何眷眷于斯而顧復不捨乎不十一二日之間有黃龍祖席之命請乃乘此機會而渡潯陽歸江西焉雪堂曰靈源好比類衲子曰古人有言譬為土木偶人相似為木偶人耳鼻先欲大口目先欲小人或非之耳鼻大可以小口目小可以大為土偶人耳鼻先欲小口目先欲大人或非之耳鼻小可以大口目大可以小夫此言雖小可以喻大矣學者臨事取捨不厭三思可以為忠厚之人也記聞偶像也木像曰木偶土像曰土偶也雪堂說靈源愛比方人物較其短長而言曰古人有言譬如做土木偶人一般做木偶人耳𦖋并鼻準必竟先要極大口唇與眼孔必竟先要極小人或非之以為不是蓋不知耳𦖋與鼻準大者何可以剷削使小也口唇與眼孔小者何可以開鑿使大也做土偶人耳𦖋并鼻準必竟先要小口唇與眼孔必竟先要大人或非之以為不是蓋不知耳𦖋鼻準小者何可以填補使大也口唇眼孔大者何可以填補使小也夫此言雖是小事誠可以比況叢林中大事矣學道人臨事之時或取或捨不辭多思重味可以為忠誠篤厚之人也𦖋音朵雪堂曰萬菴送高菴過天台回謂豫言有德貫首座隱景星巖三十載影不出山龍學耿公為郡特以瑞巖迎之貫辭以偈曰三十年來獨掩關使符那得到青山休將瑣末人間事換我一生林下閒使命再至終不就耿公嘆曰今日隱山之流也萬菴曰彼有老宿能記其語者乃曰不體道本沒溺死生觸境生心隨情動念狠心狐意諂行誑人附勢阿容徇名荀利乖真逐妄背覺合塵林下道人終不為也豫曰貫亦僧中間氣也逸事萬菴名道顏大慧杲嗣也貫首座嗣法未詳使符是使人持竹符書請簡也隱山指洞山價所訪隱山說狼多貪害物曰狼間氣出格之人也雪堂舉高尚其志之士以警無德求名者說萬菴送高菴過天台歸來謂豫曰有德貫首座隱居景星巖三十年之久影跡不出天台山龍學耿公為台州太守特以瑞巖古剎迎之出世貫高尚其志而辭之以偈曰三十年來獨掩關表己久與世踈之意使符那得到青山言青山之于塵市甚遠何故而致通書信休將瑣末人間事換我一生林下閒林下道人以閒為貴古人謂三萬六千不易半日其貴可知瑞巖瑣末詎可換之乎耿公見其說偈孤妙後使再請終不肯就耿公嘉嘆之曰豈僅昔日有高人隱山耶今日亦有此高人隱山是此等高人之流亞也萬菴又謂豫曰彼時幸有耆宿能記載其貫之語者乃曰不肯體悉此道根本汩沒沉溺生死海中觸境生取捨之心隨情起人我之見嫵媚同狐意貪害似狼心諂曲其行以欺人依附勢位阿辭色順世求名苟且圖利乖真并逐妄背覺與合塵如此等類林下尚志道人畢竟是不肯為也豫亦曰德貫首座亦僧中出格人也雪堂生富貴之室無驕倨之態處躬節儉雅不事物住烏巨山衲子有獻鐵鏡者雪堂曰溪流清泚毛髮可鑑蓄此何為終却之行實泚水清也記雪堂平生居處大富大貴之家殊無驕奢倨傲體態處安自己撙節儉約胸中雅正而不愛物住持烏巨山時方來衲子有呈獻鐵鏡一圓雪堂辭之曰溪水瑩徹澄清且泚一毛一髮可鑒無餘藏此欲何為耶究竟只是不受而却之可謂廉矣雪堂仁慈忠恕尊賢敬能戲笑俚言罕出于口無峻阻不暴怒至於去就之際極為介潔嘗曰古人學道於外物淡然無所嗜好以至忘勢位去聲色似不勉而能今之學者做盡伎倆終不奈何其故何哉志不堅事不一把作匹似間耳行實忠恕盡己之謂忠讓人之謂恕俚言鄙俗之言介所守之節伎倆巧也匹似間方語不要緊也記雪堂仁愛有理慈柔有德忠以盡己恕以讓人賢者尊之能者敬之戲謔笑嘲鄙俚言詞少出於口無孤峻險阻不橫暴恚怒至于出一叢林入一保社于其中間極為耿介廉潔曾曰上古聖人務學斯道于一切事物總不干涉淡爾無欲全不貪染以至有權勢職位者而忘勢位有佳聲體面者而去聲色似不假勉強而能忘能去今之學人費盡許多心力做盡許多伎倆究竟不能成就終不奈何此個緣故何為而致然哉蓋由他無生鐵鑄就的堅確志向行事不篤切專一把做不要緊的事幹所以不及古人耳雪堂曰死心住雲巖室中好怒罵衲子皆望崖而退方侍者曰夫為善知識行佛祖之道號令人天當視學者如赤子今不能施慘怛之憂垂撫循之恩用中和之教奈何如仇讐見則詬罵豈善知識用心乎死心拽拄杖趂之曰爾見解如此他日諂奉勢位苟媚權豪賤賣佛法欺罔聾俗定矣豫不忍故以重言激之安有他哉欲其知恥改過懷慕不忘異日做好人耳聰首座記聞方侍者名惠方號超宗黃龍南之嗣也慘怛慈悲之念痛惜之心也撫安循順也中和理無偏頗事𫁉緩急也仇讐猶寇害也詬詈也趂逐也激之感發其志也雪堂示人當識師家威嚴之故欲其改過非是寇讐於人說死心住持雲巖時入室之際或乘師子展奮迅之威而似乎怒或發疾雷閃電光之機而似乎罵衲子不曉師家慈悲之故落草之談反以醍醐為毒藥作怒罵會皆望之如險崖而生退息焉方侍者豈不達此權便耶蓋欲使學者知師家逆行順行天莫測而固為辨問之曰夫為善知識行佛祖授受之道出世號令為人天師表當以自己為乳母視學者如同小孩子一般今反不能施慈悲惻隱之心垂鞠育恆順之德用中道調和之理以利益一切衆生奈何反如仇寇怨讐耶見則詬怒呵罵成甚體統這等樣豈是善知識用心乎死心乃大發機用直現全身拽拄杖打趂之曰爾猶作這般見解耶他日諂媚宰官曲權豪裨販如來大法鼓惑聾夫啞俗定去在豫不忍此等故乃以硬語逆風撼激之安有仇讐之理哉欲其知道慚愧改過遷善懷慕入心而永劫不忘異日出人頭地做個端正好人耳死心新和尚曰秀圓通嘗言自不能正而欲正他人者謂之失德自不能恭而欲恭他人者謂之悖禮夫為善知識失德悖禮將何以垂範後乎與靈源書秀圓通名法秀天衣懷之嗣死心和尚警主法者當躬行以垂範後學說秀圓通曾言自家身心不端正而欲使他人身心端正者這教做失德自家身心不恭肅而欲使他人身心恭肅者這教做悖禮夫為人師法稱善知識既失喪其德悖亂其禮不審將什麼為法式以垂範後學乎死心謂陳瑩中曰欲求大道先正其心少有忿懥則不得其正少有嗜欲亦不得其正然自非聖賢應世安得無愛惡喜怒直須不置之於前以害其正是為得矣廣録忿是怒之甚懥是怒之滯死心謂陳瑩中求道當以正心為主說欲求無上大道先要端正其心一毛頭許好惡之念莫令他起若才有一毛頭許忿懥念頭則已失其正了矣才有一毛頭許嗜欲念頭則亦已失其正了矣倘不是生知之聖力行之賢應世人間安得無七情六欲直須竭力除遣不得有一毛頭許置之於前以𢦤其正乃可以為得正而可求道矣求道者其可不正心歟死心曰節儉放下最為入道捷徑多見學者心憤憤口悱悱孰不欲繼踵古人及觀其放下節儉萬中無一恰似世俗之家子弟不肯讀書要做官人雖三尺孺子知其必不能為也廣録節是撙節儉約也憤心求通而未得之意悱口欲言而未能之貌死心示人入道之要說節儉之法是世出世間為人之根本何故又要放下言節儉尚且要放下況不節不儉乎若放不下雖是好事亦為道障安得有入路乎故云節儉放下最為入道捷徑每見學者心地憤憤然而求通口頭悱悱然而欲說是那個不愛繼紹接踵古人及看他欲繼古人而放下節儉之時萬個中難尋一個既放不下節儉而欲紹接古人有是理乎這樣人儞說恰似個甚麼恰似那在家人的兒子一句書也不讀要想去做官就是三歲孩兒也曉得他必定是做不得的入道不放下做官不讀書可比知矣死心謂湛堂曰學者有才識忠信節義者上也其才雖不高謹而有量者次也其或懷邪觀望隨勢改易此真小人也若置之於人前必壞叢林而汙瀆法門也實録死心謂湛堂當知人好歹說學者性情多種略而言之有三焉第一有才學見識忠而不欺信而以實節而有操義而合宜如此者上也第二其才識雖不甚高妙恭謹而有度量如此者次也第三其或胸中所懷私邪傍觀窺望隨其勝敗之勢更易其心不相顧慮如此者真小人也此等人切忌用他若是將來放在人前必定是破壞招提而玷汙法化門庭也不可不慎也死心謂草堂曰凡住持之職發言行事要在誠信言誠而信所感必深言不誠信所感必淺不誠之言不信之事雖平居庶俗猶不忍行恐見欺于鄉黨況為叢林主代佛祖敷宣法化發言行事苟無誠信則湖海衲子孰相從焉黃龍實録誠是心中實理信是合義嘉言萬二千家為鄉五百家為黨死心謂草堂住持人要以誠信為主說凡住持之職者發一言行一事畢竟要誠畢竟要信發言真誠而不虗妄其所以感動於人必竟入骨入髓發言若是虗妄而不真誠其所以感動于人必竟膚淺浮泛不實之言虗妄之事雖尋常庶民猶不忍行之惟恐不見信于鄉黨而無體面況為招提主人替佛祖宣布法化開發一言施行一事倘心無實理言不及義將甚麼以感服于人而使四海五湖衲子自來相從焉死心曰求利者不可與道求道者不可與利古人非不能兼之蓋其勢不可也使利與道兼行則商賈屠沽閭閻負販之徒皆能求之矣何必古人棄富貴忘功名灰心泯智於空山大澤之中㵎飲木食而終其身哉必謂利與道行之不相違礙譬如捧漏巵而灌焦釜則莫能濟矣因與韓子蒼書行販曰商坐賣曰賈宰生曰屠賣酒曰沽閭閻里門也負背荷物也賤買貴賣曰販漏巵漏酒器也焦釜是𤊶鍋死心曉人道利不可并行說求財利的人只曉得利豈可與道求妙道的人只曉得道豈可與利古人非不能以道利竝行蓋其兩者之勢不可竝行也設使財利之與大道可以兼行則行商坐賈屠宰酒沽閭閻小人負販僕使俱皆可以財利易大道矣又何必古人捨四海之富天子之貴忘碩大之功溥布之名死灰其心泯滅其智于窮嚴廣澤與世邈遠之所渴飲㵎流饑餐木果而終其身也哉若必謂妙道與財利可以竝行而不相違悖譬如捧破漏之酒巵去灌救𤊶鍋一般漏巵之本身灌江河尚不能滿焉可以灌沃焦鍋則決定是莫能濟斯急矣𤊶音辣死心曰晦堂先師昔遊東吳見圓照赴淨慈請蘇杭道俗爭之不已一曰此我師也汝何奪之一曰今我師也汝何有焉一本見林間録圓照名宗本天依懷之嗣也死心表有德者感人懷慕不舍說晦堂先師昔遊東吳姑蘇時見圓照和尚赴杭臨安淨慈寺之請蘇杭兩處緇素爭之不已蘇人依依不舍如子戀母而曰此我等蘇人之師也汝等杭人何得無狀而奪去之焉杭人孜孜欲得如渴逢甘露而曰今我等杭人之師也汝等蘇人何得偏局而長有之焉其圓照之德感人懷仰是如此死心住翠巖聞覺範竄逐海外道過南昌邀歸山中迎待連日厚禮津送或謂死心喜怒不常死心曰覺範有德衲子鄉者極言去其圭角今罹橫逆是其素分豫以平日叢林道義處之識者謂死心無私於人故如此西山記聞竄驅逐也道路也南昌即洪州也卿昔也罹遭也記死心住翠巖聞覺範有海外之逐路經洪州使人邀請入山迎接欵待數日厚贈贐儀津潤而去或有人說死心昔日不喜覺範今日何故又喜其遷變不常如此死心曰覺範乃有道有德的衲子也昔者之怒極言以抑之使他勿露圭角于外以免禍也今罹此無辜之橫逆是他不善韜光自晦以致于斯素分如是豫以平日叢林大體當行之理合宜之事相交處焉有喜怒之心哉有識之者俱謂死心之意公而不私故于人是這等樣死心謂草堂曰晦堂先師言人之寬厚得於天性若強之以猛必不悠久猛而不久則返為小人侮慢然邪正善惡亦得於天性皆不可移惟中人之性易上易下可從而化之實録死心謂草堂人之秉性有可教有不可教說晦堂先師言人之賦性也有寬緩者也有厚重者咸是天性致然有不可勉強者若勉強教他如何勇猛如何精進必不能悠長久遠既是勇猛不長久則反為小人輕忽侮慢然邪之與正善之與惡都是如此咸是天性使然皆不可移易惟是在不邪不正不善不惡之間賦性著中者可以使上可以使下可就而教化之季而謂此亦因人而施之說也除一闡提詎有不可化之人哉昔天魔以百計惱亂世尊世尊以軟硬二種語教化之盡皆調伏此又何說也草堂清和尚曰燎原之火生於熒熒壞山之水漏於涓涓夫水之微也捧土可塞及其盛也漂木石沒丘陵火之微也勺水可滅及其盛也焦都邑燔山林與夫愛溺之水瞋恚之火曷常異乎古之人治其心也防其念之未生情之未起所以用力甚微收功甚大及其情性相亂愛惡交攻自則傷其生他則傷其人殆乎危矣不可救也草堂名善清黃龍祖心之嗣也燎火熾也熒螢同耀耀也比火小的意思燔燒也草堂清和尚與韓子蒼書示人以修心之法說夫人愛水嗔火最難隄防最難調伏諸有智者皆以譬喻而得解會始能隄防調伏焉耳這嗔火譬如遍燎原野的大火生發于熒熒一星一樣這愛水譬如崩壞隄山的大水滲漏于涓涓一滴一般夫水方一滴滲漏之時兩手捧土可以閉塞用力不多及其水勢盛大也漂流大木小石淹沒丘壑陵阜焉火才一星初發之際一杓之水可以泯滅用功且少及其火勢盛壯也焦傷州都縣邑燔壞廣山大林焉比之愛溺之水瞋恚之火何常有差別乎古學道人修理其心也是隄防其一念之未生七情之未起把得穩靠得定所以用力最少而收功最多至一念既生則性情相亂七情既起則愛惡交攻于自己毀壞其生命他人傷損其形體若至于此且不殆乎其危必矣決定是不可救的治心者可不防念于未生歟草堂曰住持無他要在審察人情周知上下夫人情審則中外和上下通則百事理此住持所以安也人情不能審察下情不能上通上下乖戾百事矛盾此住持所以廢也其或主者自恃聰明之資好執偏見不通物情捨僉議而重己權廢公論而行私惠致使進善之途漸隘任衆之道益微毀其未見未聞安其所習所蔽欲其住持經大傳遠是猶却行而求前終不可及與山堂書僉衆也却行是怕走求前是要趂路程草堂清曉住持者欲經大傳遠當通人情達物理說住持沒有別法其專要處就在審諦詳察人情周遍了知上下耳夫人之性情一一審實了了於心則中而敘職外而廣衆自然神志和合上而方丈下而諸寮自然氣脉通泰而百事竝隆俱該整理也如此住持一定是安的若人情一一不察不得了了於心則衆情不上通上情不下及而氣血不通上既乖違下亦背戾而精神不爽則百事廢弛互相矛盾也如此住持一定是廢的其或主持者無謙光之德自恃聰明之資好固執一偏之見不通諸物情理捨衆說而崇重自己權柄廢公論而獨行私恩小惠因此之故致使進善之路漸漸陜隘荷衆之道杳杳無聞他本不曾見本不曾聞毀之不聽自所習染自所障蔽安之不改如此欲其住持法道溥布四海流芳百世就如那怕行路的人而欲貪求前程一樣畢竟是不可到的統理大衆者欲要佛祖慧命不絶可不於此留心乎草堂曰學者立身須要正當勿使人竊議一涉異論則終身不可立矣昔太陽平侍者道學為叢林推重以處心不正識者非之遂致終身坎坷逮死無歸然豈獨學者而已為一方主人尤宜祇畏與一書記書平侍者事詳音義合注太陽明安名警玄梁山觀之嗣也坎坷不平之貌草堂警學者處心要端正說學者成立此個身子必定要心裏端正行履確當毋使人竊議批判一涉異論訐發則到底此身不可成立矣昔太陽平侍者入明安之室已久道學為叢林廣衆推獎尊重以胸中處心不端正明安有手叉之讖有智識者俱非毀之遂使一生不能成立坎坷到老死於大蟲之口竟不免明安之記死無所歸然豈獨學者要心術端正為一方主人四衆師範更是心中要端正尤宜敬慎之焉草堂謂如和尚曰先師晦堂言稠人廣衆中賢不肖接踵以化門廣大不容不親踈於其間也惟在少加精選苟才德合人望者不可以己之所怒而踈之苟見識庸常衆人所惡者亦不可以己之所愛而親之如此則賢者自進不肖者自退叢林安矣若夫主者好逞私心專己喜怒而進退於人則賢者緘默不肖者競進紀綱紊亂叢林廢矣此二者實住持之大體誠能審而踐之則近者悅而遠者傳則何慮道之不行衲子之不來慕乎疏山石刻親愛而近之也踈惡而遠之也緘封也默不語也草堂謂如和尚住持人當親賢遠奸識大體說先師晦堂嘗言稠人之內廣衆之中龍蛇混雜凡聖同居君子小人相接繼踵以法化門庭最廣最大于其中間賢者不得不親愚者不得不疏也惟在主者略加精細揀選果是才力德行合人之心為人所仰望者又不可以己之所不欲怒而疏遠之果見識庸常不合人心為人之所厭惡者亦不可以己之所欲愛而親厚之如此則君子道長而日進小人道消而自退叢林一定是安泰的若夫主者好高自負逞己私心專一己偏見心喜而進心怒而退于人則君子道消而緘默不言小人道長而爭競竝進綱不綱紀不紀事事謬亂叢林一定是廢的此兩者實非小節乃住持之大體若果能審諦而實踐之則近而四衆欣悅遠而衲子宣傳則又何憂法道之不大行諸方衲子不來向慕乎草堂謂空首座曰自有叢林已來得人之盛無如石頭馬祖雪峯雲門近代唯黃龍五祖二老誠能收拾四方英俊衲子隨其器度淺深才性能否發而用之譬如乘輕車駕駿駟總其六轡奮其鞭策抑縱在其顧盼之間則何往而不達哉廣録空首座名性空黃龍悟新之嗣雪峯名義存德山宣鑑之嗣雲門名文偃雪峯之嗣也才勝萬人曰英智過千人曰悛具車馬曰駕駿馬之良者駟一乘四馬也六轡一車四馬各兩轡共八轡以驂馬內兩轡繫于軾驂馬外兩轡及夾轅兩服馬四轡分置兩手以為六轡䇿馬箠也顧回視也盻宜盼亦視也草堂謂空首座善得人者必善用人說自從有叢林已來師家得有道的人而大興盛不若石頭遷馬祖一雪峯存雲門偃四聖近代來唯黃龍清五祖演二大老果能羅緻收拾東西南北四方英靈俊秀衲子隨順其器具量度或淺或深并才力性情有能無能開發而選用之譬如乘一輕車駕御的人坐處于上良能駿駟驂服于前手總六轡奮勇鞭䇿一收一放在其左顧右盼之間則無所不到如入無何有之鄉而了無阻礙矣黃龍五祖得人行道亦類于斯也草堂曰住持無他要在戒謹其偏聽自專之弊不主乎先入之言則小人諂迎合之讒不可得而惑矣蓋衆人之情不一至公之論難見須是察其利病審其可否然後行之可也疏山實録草堂警住持者勿偏聽自專說住持人無他法要緊在戒慎其偏聽謹慎其自專這兩種弊病更要不取先入之言則讒諂面諛之小人自無縫罅可乘主人翁自不被他惑亂矣蓋稠人廣衆之性情不同至公至正之道理難顯須是智鑑精明詳察其利病慧眼洞徹審處其可否然後信手拈信手用信步行庶幾可耳草堂謂山堂曰天下之事是非未明不得不慎是非既明以理決之惟道所在斷之勿疑如此則姦不能惑強辨不能移矣清泉記聞山堂名道震泐潭之嗣也草堂謂山堂剖斷是非要合道理說凡一切事有是有非未得明了不可不慎是非既是分明當決斷以正理正理者何道之極致也得道極致斷一切事更何疑焉果能如此則奸邪便者不能亂利口雌黃者不能奪矣欲斷是非者詎可忽略于斯理乎山堂震和尚初却曹山之命郡守移文勉之山堂辭之曰若使飯粱囓肥作貪名之衲子不若草衣木食為隱山之野人清泉才菴主記聞粱粟類似粟而大其味嘉美囓噬也肥豐肥也指厚味說記山堂震和尚初不受曹山之請本郡太守移文勵其出世山堂以書辭之曰若使隨逐其情豐肥其口粱美其腹做貪名之衲子不若高尚其志白茆其衣碩果其食為隱山之野人郡侯其必為我諒原也山堂曰蛇虎非鴟鳶之讎鴟鳶從而號之何也以其有異心故牛豕非鸜鵲之馭鸜鵲集而乘之何也以其無異心故昔趙州訪一菴主值出生飯州云鴉子見人為甚飛去主罔然遂躡前語問州州對曰為我有殺心在是故疑於人者人亦疑之忘於物者物亦忘之古人與蛇虎為伍者善達此理也老龐曰鐵牛不怕獅子吼恰似木人見花鳥斯言盡之矣與周居士書鴟鳶惡鳥攫鳥子而食者鸜鵒俗呼八哥是也鵲喜鵲也馭使馬也罔然莫測也躡蹈也伍聚也伴侶之意老龐襄州龐蘊字道玄衡陽縣人得法於馬祖也山堂示人忘機之道說乃設譬自問自答云毒蛇惡虎不是鴟鳶之怨讎見則從而號噪之其故何也以其彼此皆有異惡之心故也馴牛豢豕不是鸜鵲之使馭鸜鵲集于背而乘騎之其故又何也以其彼此俱無異惡之心故也昔趙州訪一菴主值出生飯州云鴉子見人為甚飛去主罔然遂躡前語問州州對曰為我有殺心在以此機緣看來是故我疑惑于人而人一定亦疑惑于我我忘于物而物一定亦相忘于我也古嚴陽尊者蛇虎來手中就食而常與為伍者正善達此無疑忘物之理也老龐道但自無心於萬物人無我也何妨萬物常圍繞法無我也鐵牛不怕師子吼恰似木人見花鳥情與無情皆為一體也斯言亦盡達此無疑忘物之理矣季而謂山堂以趙州訪菴主話前後印證無異心可謂如完器盛水不漏一滴也如此理會這則公案有甚長處豫曾著值出生飯云貪他一粒米失却萬年糧著為甚飛去云救得一半著主罔然云却較些子著躡前問云兩重公案著有殺心在云教壞人家男女一竝存此以供仁者博笑山堂曰御下之法恩不可過過則驕矣威不可嚴嚴則怨矣欲恩而不驕威而不怨恩必施於有功不可妄加於人威必加於有罪不可濫及無辜故恩雖厚而人無所驕威雖嚴而人無所怨功或不足稱而賞之已厚罪或不足責而罰之至重遂使小人故生驕怨矣御統也理也驕傲也自矜也辜罪也愆也山堂與張尚書書示為人上者統理在下之則說調御使人之法恩寵敷布不可過於及人若太過則不以為益人而使人反生驕傲之性矣威令約人不可過於太嚴若太嚴則不以為誡人而使人反生怨憾之心矣欲恩多而使人不驕威猛而使人不怨恩必要施之於有功勛之輩不可妄加於無功勛之人威必要加於有過愆之人不可泛濫施於無罪之輩故恩寵何妨於周密而人自不驕威令何妨於驕喝而人自不怨設使功勞非大不足稱賞而恩施已廣罪愆本小不宜重責而罰處太過遂使小人從此有隙可乘有過可議而生驕怨心矣山堂曰佛祖之道不過得中過中則偏邪天下之事不可極意極意則禍亂古今之人不節不謹殆至危亡者多矣然則孰無過歟惟賢達之士改之勿吝是稱為美也山堂與趙超然書示人當謹乎中道勿吝改過說三世諸佛歷代諸祖授受之道不過是以得中道第一義為主若不得中則胸裏無主而墮偏邪也世出世間天下之事不可畢竟要求其稱心滿足若必要稱心則貪婪多事而生禍亂也古人今人奢華不節儉縱肆不謹慎危殆至于喪失身命者不少然則人非聖人是那個就全沒得過失歟惟保道之賢達理之士改過不吝方才教做好人也山堂同韓尚書子蒼萬菴顏首座賢真牧避難于雲門菴韓公因問萬菴近聞被李成兵吏所執何計得脫萬菴曰昨被執縛饑凍連日自度必死矣偶大雪埋屋其所繫屋壁無故崩倒是夜幸脫者百餘人公曰正被所執時如何排遣萬菴不對公再詰之萬菴曰此何足道吾輩學道以義為質有死而已何所懼乎公頷之因知前輩涉世禍害死生皆有處斷矣韓子蒼名駒問道於山堂和尚任至尚書李成宋高宗紹興元年作亂江淮劫掠襄沔自號李天王記山堂同韓尚書子蒼萬菴顏首座賢真牧幾人同避亂於雲門菴時閒坐次韓公因問萬菴昔日聞和尚被李成之兵吏所執不審和尚以何方便計策而得脫耶萬菴答曰昨被執去時時繫縛少食而饑乏衣而凍一連數日自己忖度必死無疑矣偶天霰大雪高堆屋脊其禁繫之房壁不意盡自崩倒是夜之中幸而得脫此難者有百餘人公復問之曰正當被他拏捉時如何安排消遣萬菴時見其所問似鑿乃緘默而不對公亦是實心欲討個抵當生死方便耳故再詰問之萬菴亦實在向他道此何足言吾輩參禪學道是為了生脫死也了生死者詎可無義乎臨難毋苟免義所當為也故君子義以為質不苟貪生何畏怯之有公亦默然點首而心許之因是而知前輩歷涉世間當禍害死生之際畢竟有個主張以處斷之矣前當上聲山堂退百丈謂韓子蒼曰古之進者有德有命故三請而行一辭而退今之進者惟勢與力知進退而不失其正者可謂賢達矣記聞記山堂退百丈時謂韓子蒼說古之人見進于當世者必是自己有謙光導人之德外護有慕賢求道之請故一次二次以至三次迎請不得已而行于世焉或應緣事訖理所當退一辭而退焉終不𦆆纖濡滯今之苟進于當世者惟恃權勢與才力耳能知當進則進當退則退而不失其正道者可謂有德賢人達道高士矣山堂謂野菴曰住持存心要公行事不必出於己為是以他為非則愛惡異同不生於心暴慢邪僻之氣無自而入矣幻菴集野菴名祖璇大慧杲之嗣也山堂謂野菴主法要心存公道說住持人胸中所懷要公而不私凡行一切事不必專主出于自己者方才為是他人所言所行恰當詎可不以為是耶不必拘定以他為非若是自己所言所行不恰當詎可不以為非耶若肯如此存心則偏愛偏惡若異若同種種私慝自不生於胸中則橫暴我慢歪邪偏僻種種氣習自無縫罅而可入矣山堂曰李商老言妙喜器度凝遠節義過人好學不倦與老夫相從寶峯僅四五載十日不見必遣人致問老夫舉家病腫妙喜過舍躬自煎煮如子弟事父兄禮既歸元首座責之妙喜唯唯受教識者知其大器湛堂嘗曰杲侍者再來人也山僧惜不及見湛堂遷化妙喜璽足千里訪無盡居士於渚宮求塔銘湛堂末後一段光明妙喜之力也日涉記元首座名道元圓悟勤祖之嗣也唯應速而質也璽足重皮也渚宮荊州府也塔銘俱詳音義山堂表妙喜器槩以勵人說廬山李商老嘗言妙喜之為人才器量度凝澄悠遠操節義氣超邁於人嗜好學業精進不退曾與老夫相從寶峯且四五年人情周密十日不見必發人趨問老夫因修造觸犯土神全家病腫妙喜親自過舍躬身煎藥煮粥就如子之事父弟之事兄一般禮節既回寶峯元首座責其僧不宜事俗妙喜唯唯低躬承受教誨有見識者知其量度不凡一定是個大器湛堂常稱喜曰杲侍者乃再來應世之人也山僧老矣惜不及見他後來好處逮湛堂示寂茶毗睛齒數珠不壞并舍利妙喜不憚千里之遙腳起重璽而不休息訪張無盡居士于湖廣荊州府以求塔銘焉所以湛堂末後根珠不壞這一段光明若非妙喜訪無盡之力其誰彰著之也乎妙喜杲和尚曰湛堂每獲前賢書帖必焚香開讀或刊之石曰先聖盛德佳名詎忍棄置其雅尚如此故其亡也無十金之聚唯唐宋諸賢墨蹟僅兩竹籠衲子競相酬唱得錢八十餘千助茶毗禮可菴集獲得也墨蹟即書籍法帖也茶毗梵語此云火化妙喜表湛堂之廉而又好古以示後學說湛堂每獲古聖先賢故書法帖必淨手焚香開讀或刊刻于石以垂永久乃曰前聖大德美名豈可忍心廢棄拋置耶其湛堂和尚素性貴尚古蹟是這樣故其遷化之日無十兩之積其所蓄唯唐宋兩朝諸賢人墨刻法帖且兩篾箱其廉可知也衲子競進倡率互相酬唱共得錢八十餘串來佐助茶毗之費以成喪禮妙喜曰佛性住大溈行者與地客相歐佛性欲治行者祖超然因言若縱地客摧辱行者非惟有失上下名分切恐小人乘時侮慢事不行矣佛性不聽未幾果有莊客弒知事者可菴集佛性名法泰圓悟勤祖嗣也地客佃戶也毆捶也祖超然名文祖天衣懷嗣也下殺上曰弒妙喜謂主叢林者當要識上下名分說佛性住大溈時行者與佃戶子相打佛性欲處行者以清淨僧法祖超然因諫止道僧法本皆清淨若縱佃戶責治行者不獨有失上下名分切恐小人心腸他就從此膽大乘隙欺主侮慢大衆事不行矣佛性不聽而治行者後不久果有佃戶子弒知事之事荷叢林之任者可不慎歟妙喜曰祖超然住仰山地客盜常住穀超然素嫌地客意欲遣之令庫子行者為彼供狀行者欲保全地客察超然意抑令供起離狀仍返使呌喚不肯供責超然怒行者擅權二人皆決竹篦而已蓋超然不知陰為行者所謀烏乎小人狡猾如此可菴集抑逼也狡猾奸頑多詐也妙喜曉主叢林者不可不知小人狡猾說超然住仰山之時地客偷盜常住穀子超然素性原嫌地客意下久欲遣之未逢其便故令庫子行者速為彼供狀就事驅逐之行者皆在小人之列不唯不供狀而反保全之察得超然有強令供起離狀之意仍復返使地客呌喚不服不肯供責超然怒行者擅權與地客作主二人俱決竹篦而止蓋超然不曉得小人黨與暗地商謀已就反無計以驅遣嗚乎小人奸頑狡猾是這等樣妙喜曰愛惡異同人之常情惟賢達高明不被其所轉昔圓悟住雲居高菴退東堂愛圓悟是惡高菴同高菴者異圓悟由是叢林紛紛然有圓悟高菴之黨竊觀二大士播大名於海上非常流可擬惜乎昧於輕信小人諂言惑亂聰明遂為識者笑是故宜其亮座主隱山之流為高上之士也智林集大士有德之稱亮座主蜀人頗講經論因參馬祖發明大事隱於洪州西山杳無消息隱山潭州龍山也因參馬祖發明心要後隱龍山焉二事俱詳音義妙喜示人當各存正見勿偏好惡說如意而愛違情而惡差殊而異和合而同此皆人之一定常情也惟是有道之賢達理之士見識高遠心地明白者不被愛惡異同所轉昔圓悟初住雲居高菴退處東堂之時有愛圓悟的便厭惡高菴有同高菴的便驚異圓悟由此之故一叢林中紛紛紜紜而有兩家之說各于其黨焉竊觀二大士之為人應機接物誘導諸子播大名於天下不是尋常流輩之可比擬惜乎明眼人前三尺暗反昧於輕信小人諂媚之言惑亂智者聰明遂被有見識者以為笑具由是觀之為人誠難出世不如避世宜其西山亮座主潭州隱山那一輩人為高尚其志之美士也妙喜曰古人見善則遷有過則改率德循行思免無咎所患莫甚於不知其惡所美莫善於好聞其過然豈古人之才智不足識見不明而若是耶誠欲使後世自廣而狹於人者為戒也夫叢林之廣四海之衆非一人所能獨知必資左右耳目思慮乃能盡其義理善其人情苟或尊居自重謹細務忽大體賢者不知不肖者不察事之非不改事或是不從率意狂為無所忌憚此誠禍害之基安得不懼或左右果無可咨詢者猶宜取法於先聖豈可如嚴城堅兵無自而入耶此殆非所謂納百川而成大海也妙喜與寶和尚書為人當法古尊賢遷善改過說上古賢人見人有善則遷就為善自己有過則速即改悔遵修全德依操實行恆正思惟淨身口意所憂患者莫過於不曉得自己的惡所美好者莫過於喜聞自己的過然豈是古人才力智慧不足識慮見理不明而要如此也耶誠欲使末世來樹人我赤幟傾無梁斗口自廣大而狹小于人者為矜式也夫叢林稠人之廣四海萃類之衆本不是一知一見所能獨曉必竟要憑左右人之耳目千思萬慮庶能窮盡其合宜之理善周其僉衆之情倘或為主者威嚴其居自重其體瑣末之事毫放不過大體段處忽略不經君子不知小人不察自己行蹉了的事不肯改悔皆行好事又不肯依從任性不羈猖狂無檢無所弗為全不忌畏如此行徑此誠培長禍害之基本如何不畏設或左右果的的沒有得可商量扣問者宜取法上古先聖豈可就如百尺嚴城萬馬堅兵無門路而可入也耶若是這等樣且不是所謂容納百川而成大海的胸襟也宜改過遷善求善以自廣可矣妙喜曰諸方舉長老須舉守道而恬退者舉之則志節愈堅所至不破壞常住成就叢林亦主法者救今日之弊也且詐狡猾之徒不知羞恥自能諂奉勢位結托於權貴之門又何須舉妙喜與竹菴書論舉賢貴端正說諸方舉長老住持必定舉有操節有道行而好恬靜退守的舉之出世則志向節槩愈更堅固所到之處常住不具備者具備安有破壞之理不增補者增補一定事事成就此亦主法者具擇賢眼拯救今時之弊病也且詭詐便奸頑無賴之徒無慚無愧不曉羞恥自能諂媚趨奉勢位以求利結交付托于權貴之門以求名者切不可舉欲舉賢才以繼住持慎毋忽于此焉妙喜謂超然居士曰天下惟公論不可廢縱抑之不行其如公論何所以叢林舉一有道之士聞見必欣然稱賀或舉一不諦當者衆人必戚然嗟嘆其實無他以公論行與不行也烏乎用此可以卜叢林之盛衰矣可菴集超然居士郡王趙令矜字表之圓悟勤祖嗣也抑遏也戚憂也妙喜謂超然舉賢畢竟要合公論說公論乃天下之正理古今之正議決定是不可廢的設或是勉強抑止不行其奈已是公論了矣如之何哉所以叢林之中或乏住持或少職事若舉一個有見諦端正之士聞見之者必人人欣然稱賀合寺歡悅若舉一個見諦不端正之人必人人戚戚然嗟嘆通院竊議如此何以使然其實無別以公論或行或不行而致然也烏乎以此推之而叢林中之吉凶禍福不卜可知矣妙喜曰節儉放下乃修身之基入道之要歷觀古人鮮有不節儉放下者年來衲子遊荊楚買毛褥過浙右求紡絲得不愧古人乎妙喜示人修身入道極要說夫人習染難除莫甚于貪乃三毒之最為首第一別無方法可以對治的惟樽節其有儉約莫奢此個方法可以對治也節儉心現前貪求心自然放下如此實乃操修自身之基本趣入正道之要歸遞觀從上來古人那有一個不是節儉放下的近年來禪和子遊荊楚上洞山問麻三斤歟買毛褥耳過浙右渡洛伽禮圓通歟求紡絲耳寧不有愧于古人乎何其貪也妙喜曰古德住持不親常住一切悉付知事掌管近代主者自恃才力有餘事無大小皆歸方丈而知事徒有其虗名耳嗟乎苟以一身之資固欲把攬一院之事使小人不蒙蔽紀綱不紊亂而合至公之論不亦難乎與山堂書妙喜曉住持人當存大體說自古先德住持叢林只主張大法提挈衲子不自躬親兼理常住一切庶物盡付知事頭首各局掌管近世主者不然自恃才力以為有餘不論大事小事俱入方丈兼攝而知事徒設序數虗當其名耳嗟乎只是可惜倘以你一身資質執固不捨勉強把攬在手主張一院之事必欲要使小人不昏蒙障蔽於我法度不參差條目如法而又必使全合衆人極端正公道議論寧不難乎主持人只提振大法綱宗可也妙喜曰陽極則陰生陰極則陽生盛衰相乘乃天地自然之數惟豐亨宜乎日中故曰日中則昃月滿則虧天地盈虧與時消息而況於人乎所以古之人當其血氣壯盛之時慮光陰之易往則朝念夕思戒謹彌懼不恣情不逸欲惟道是求遂能全其令聞若夫隳之以逸欲敗之以恣情殆於不可救方頓足扼腕而追之晚矣時乎難得而易失也薌林書豐亨豐易卦名震上離下震為雷離為火名雷火豐豐大也以火明而震動盛大之象也其占有享道焉故曰豐亨陰死為消陽死為息令善也聞名遠達也妙喜曉人求道要及時慎勿失時說夫人死生之理譬如純陽既極則一陰生于其下純陰既極則一陽生于其下有盛有衰兩相乘除乃天地之間一定自然之數也惟易雷火豐取象震動火明有盛大之義而又有亨通之道但不可過只宜乎日中耳蓋言豐盛難常以此為戒也故彖辭又曰日中盛極則西昃月望盈極則有缺虧以天地自然之數觀之尚有此盛昃盈虧之理與日中時月望時且消且息而況于人乎亦可以稱時自謹也所以古人正當其年少血氣壯盛的時痛惜光陰易過歲月難留則朝也念道夕也思道戒慎敬謹益加憂懼不恣縱七情不放逸六欲孜孜汲汲惟道是求乃能全美令德名聞若夫隳壞之以安逸嗜欲毀敗之以恣蕩性情危殆至于不可拯救那時才跌腳捶胸而追悔之早已遲了矣故漢蒯徹說韓信道功難成而易敗時難得而易失時乎時乎不再來此雖世間說話誠可以比況為生死者當痛惜斯時確實難得而易失也妙喜曰古人先擇道德次推才學而進當時苟非良器置身於人前者見聞多薄之由是衲子自思砥礪名節而立比見叢林凋喪學者不顧道德少節義無廉恥譏淳素為鄙朴獎囂浮為俊敏是故晚輩識見不明涉獵抄寫用資口舌之辨日滋月浸遂成澆漓之風逮語于聖人之道瞢若面牆此殆不可救也砥礪磨勵之意涉獵是水上獵獸比況學道不真誠的意思瞢若面牆言一物無所見一步不可行也妙喜曉學者當立名節說古人揀選學人先取見地明白而有道行履端正而有德次推才力與學識而進用于當時倘不是良人美器安厝於衆人之前者眼見耳聞輒多輕薄之由是衲子暗自思忖奮發砥礪操守名節而自成立焉比見叢林凋落喪敗學者道不實悟德不真修節少操守義少合宜貪而無廉浼而無恥反譏誚性淳質素者以為卑鄙朴厚獎譽囂頑浮薄者以為英俊捷敏以是之故晚進識見不明專務抄寫語言文字以為實學重包叠裹以當玄旨如是用心豈不大錯就如那持網涉水上去獵獸一般其參差甚遠既涉獵抄寫也記讀入心用資口頭舌辨日日滋積月月浸長遂成澆淺漓薄之風及乎問著聖人大道便舌拄上齶口似磉磐眼如瞢瞽四面皆墻壁也如此樣人猶可救也耶殆不可也妙喜曰昔晦堂作黃龍題名記曰古之學者居則巖穴食則土木衣則皮草不係心於聲利不籍名於官府自魏晉齊梁隋唐以來始創招提聚四方學徒擇賢者規不肖俾智者導愚迷由是賓主立上下分矣夫四海之衆聚於一寺當其任者誠亦難能要在總其大捨其小先其急後其緩不為私計專利於人比汲汲為一身之謀者實霄壤矣今黃龍以歷代住持題其名於石使後之來者見而目之曰孰道德孰仁義孰公於衆孰利於身嗚呼可不懼乎石刻妙喜舉題名記以警後更珍他知所懼說昔晦堂作黃龍題名記有曰上古之學道者居則高巖深穴食則土芋木果衣則棕皮荷葉聲名利養不關係于心官府吏衙不投名于冊原無住持等事自魏曹操晉司馬懿齊蕭道成梁蕭衍隋楊堅唐李淵諸朝之後始初創建招提聚集四方廣衆揀選有德賢者以規正不肖之輩俾令有道智者以導誘愚鈍迷流用是而有賓有主有上有下有名分矣夫四海之多人萃積於一院擔荷斯大任者誠非易易矣要在總提其大綱舍置其小節先其當急後其可緩半點不求自利一味專益他人較之切切為自己一身圖謀者實輕清重濁之不同難比并矣今黃龍以歷代住持之名刊之石者何是使後來繼住於此者親眼而目之曰那個長老有道風有德澤那個長老有仁慈有義氣那個長老為衆那個長老為己嗚呼可不懼怕之乎題名無他使覽是而思善者可以為法惡者可以為戒也張侍郎子韶謂妙喜曰夫禪林首座之職乃選賢之位今諸方不問賢不肖例以此為僥幸之津途亦主法者失也然則像季固難得其人若擇其履行稍優才德稍備識廉恥節義者居之與夫險進之徒亦差勝矣可菴集張侍郎名九成字子韶得法于妙喜子韶謂妙喜論選西序頭首說夫禪林之中人天首座這個職品乃是推選有德者之尊位匪庸流可居今諸方不問君子小人一槩以此為僥幸津潤路途藉以射名罔利破壞規模此亦主法者之差失也雖是像季之時本難得好人若擇其操履行事稍優才力德業稍具識清廉羞恥有操節行義者選而居之比夫冒險競進不懼因果之流又略強些些矣妙喜謂子韶曰近代主法者無如真如哲善輔弼叢林莫若楊岐議者謂慈明真率作事忽略殊無避忌楊岐忘身事之惟恐不周惟慮不辦雖衝寒暑未嘗急己惰容始自南源終於興化僅三十載總柄綱律盡慈明之世而後已如真如者初自束包行腳逮於應世領徒為法忘軀不啻如饑渴者造次顛沛不遽色無疾言夏不排窗冬不附火一室翛然凝塵滿案嘗曰衲子內無高明遠見外乏嚴師良友鮮克有成器者故當時執拗如孚鐵腳倔強如秀圓通諸公皆望風而偃嗟乎二老實千載衲子之龜鑑也可菴記聞輔弼扶助也南源宜春古剎也造次急遽苟且之時顛沛傾覆流離之際遽窘也卒也拗拗捩故相違也孚鐵腳名永孚泐潭懷澄之嗣也事見音義偃靡也龜知未來之吉凶鑑照現在之妍醜也妙喜謂子韶舉有道者庶可為後學法說近年來主持提綱大法者沒人及得真如哲善輔弼贊佑叢林者沒人及得楊岐或有議論道慈明真淳槩率行事大略殊不回避忌諱楊岐捐軀奉事競競業業惟恐不周全小心翼翼惟慮不具辦雖隆冬大寒盛夏大熱未嘗急于自己有懈怠之容自慈明始受宜春太守黃守旦南源之請次受本延道吾之席後遷石霜及福嚴終于興化諸大剎且三十年之久總柄叢林紀綱法律盡慈明之世而後已如真如者初自束包行腳做禪和子時及于出世應化匡徒領衆實為大法盡瘁己躬不止如饑如渴之切者或當急遽苟且傾覆流離也不見有倉卒之色逼迫之言夏至極熱不排窗乘凉冬至極寒不附爐向火孤坐一室靜體翛然不捨無為凝塵滿案曾曰禪和子胸中若無徹上徹下之明亘古亘今之見外面乏痛棒熱喝之師擊節透關之友少能有成其大器者故當時固執拗捩不循人情如孚鐵腳倔梗橫彊孤硬端直如秀圓通皆望其道風而靡無不敬服嗟乎可不羡美之乎真楊二大老如是行履豈僅目前龜鑑誠千萬載衲子之龜鑑也實學祖道可不體認于斯歟子韶同妙喜萬菴三人詣前堂本首座寮問疾妙喜曰林下人身安然後可以學道萬菴直謂不然必欲學道不當更顧其身妙喜曰爾遮漢又顛耶子韶雖重妙喜之言而終愛萬菴之語為當記聞本首座即博山悟本也當中也言中節的意思記子韶同妙喜萬菴三人同往本首座寮中看病妙喜乃安慰之曰林下養道人先要身體安泰然後可以造詣至道若無色身將誰修證無生法忍萬菴直以為不然必欲要造詣斯道不當更顧慮其身忘身乃可以學道也妙喜斥之曰爾這漢又顛了也耶即今我和你來此做甚說與麼語話子韶雖重妙喜之言恰于時節而究竟愛萬庵之語切于勵人更為恰當子韶問妙喜方今住持何先妙喜曰安著禪和子不過錢穀而已時萬菴在座以謂不然計常住所得善能樽節浮費用之有道錢穀不勝數矣何足為慮然當今住持惟得抱道衲子為先假使住持有智謀能儲十年之糧座下無抱道衲子先聖所謂坐消信施仰愧龍天何補住持子韶曰首座所言極當妙喜回顧萬菴曰一個個都似你萬菴休去已上竝見可菴集樽節裁止也減損用度的意思儲貯也積聚也張侍郎問妙喜方今住持叢林以何事為先務妙喜答曰安著四方禪和子不過銀錢穀米而已時萬菴首座同在座中以謂不在錢穀計度常住所得或多或寡當事者善能減損奢用用得合理銀錢米穀且不勝其多矣此何足為憂慮然方今主持者惟得深蓄厚養有道有德的衲子此為先務假使主持人有大智慧大謀略能收積十年的錢糧會下沒有一個半個好操守節義明心見性的衲子先聖曾戒謂坐消信施仰愧龍天于住持者有何補益子韶乃贊許之曰不謬為人天首座其所言極為恰當妙喜回首顧復萬菴而言曰廣衆稠人愚多智少一個個都如你這樣念頭耶萬菴乃緘默不言而休去善住持者當知所先務也萬菴顏和尚曰妙喜先師初住徑山因夜參持論諸方及曹洞宗旨不已次日音首座謂先師曰夫出世利生素非細事必欲扶振宗教當隨時以救弊不必取目前之快和尚前日作禪和子持論諸方猶不可妄況今登寶華王座稱善知識耶先師曰夜來一時之說焉首座曰聖賢之學本於天性豈可率然先師稽首謝之首座猶說之不已曹洞宗曹乃撫州曹山本寂禪師嗣洞山良價和尚初離洞山往曹溪禮祖塔還止臨川有佳山水因定居焉以志慕六祖故名山為曹洞山之宗至師大盛故稱曹洞宗也率然輕忽之意萬菴顏和尚論主法者要自重勿輕評論諸方說妙喜先師宋紹興七年初住徑山之時因夜參評論諸方法道及曹洞宗旨所說甚多次日早音首座乃謂先師曰夫善知識出世教導衆生本不是小節必定要扶持振揚五宗教法當因時以救其積弊豈可只取眼前之快便耶和尚曩時在行腳中廣衆裏做禪和子閒談議論且不可虗妄何況而今登佛祖寶華王座宣揚大法稱善知識乎先師乃曰昨夜偶爾間一時之說耳何得執以為實首座曰為聖為賢學業本於人之天性使然詎可輕忽先師乃稽遲其首而稱謝之首座猶絮絮忉忉說之不已焉由此觀之首座有直言敢諫之口妙喜有寬裕納諫之量咸可法也萬菴曰先師竄衡陽賢侍者録貶詞揭示僧堂前衲子如失父母涕泗愁歎居不遑處音首座詣衆寮白之曰人生禍患不可苟免使妙喜平生如婦人女子陸沉下板緘默不言故無今日之事況先聖所應為者不止於是爾等何苦自傷昔慈明琅琊谷泉大愚結伴參汾陽適當西北用兵遂易衣混火隊中往今徑山衡陽相去不遠道路絶間關山川無險阻要見妙喜復何難乎由是一衆寂然翌日相繼而去廬山智林衡陽湖南道衡州府衡陽縣也揭高舉張示也涕泗目出汁曰涕鼻出汁曰泗不遑處心急不暇安處也下板言居于下位也谷泉名大道大愚名守芝俱汾陽昭祖嗣也汾陽名善昭首山念祖嗣也火隊軍營火兵之隊也萬菴表師家有德雖禍患切身人猶依依不捨說先師因與張侍郎論物格話侍郎言下有省先師為之上堂引神臂弓一發透過千層甲老僧拈來看直甚臭皮襪之句右相秦檜以為譏議朝政遂竄逐先師于衡陽賢侍者録朝廷貶詞高示僧堂之前衲子見之如失生身父母一樣而齎咨涕洟焉口中歎嗟眼中流淚鼻中出泗心中窘急而不暇安處由此而推妙喜為人不言而喻也音首座往衆寮一一白之曰至人處世義以為質既罹斯難不可苟免設使妙喜一生以來就如婦人女子不令人見陸地沉潛賤處下板三緘其口守訥不言故無今日衡陽之事況古先聖師子之罽賓二祖之鄴都皆所當為以示現者又豈止于此而已哉爾等何苦自切痛傷昔汾陽道望天下慈明圓琅琊覺谷泉道大愚芝相結伴欲往參扣時澤州潞安皆屯重兵無敢往者慈公四人不顧危阻渡榮澤河登太行山易衣混入火兵隊中露宿草眠不憚勞苦而往參謁汾陽昭祖今徑山之於衡陽相去不甚為遠道路無澤潞之間關山川無榮行之險阻要再見妙喜有甚難乎因此大衆方止涕泗愁嘆之聲而寂然焉至次日俱徐徐相接踵而去妙喜若無實德豈能感人戀慕如此哉應機者事蹟也法不孤起仗境方生感人者實德也如子失母淚出痛腸誰能及之學者不可疑其蹟而不思其德矣萬菴曰先師移梅陽衲子間有竊議者音首座曰大凡評論於人當於有過中求無過詎可於無過中求有過夫不察其心而疑其跡誠何以慰叢林公論且妙喜道德才器出於天性立身行事惟義是從其量度固過於人今造物抑之必有道矣安得不知其為法門異時之福耶聞者自此不復議論矣智林集梅陽廣東潮州梅陽縣也妙喜貶衡陽著正法眼藏三帙被人重譖復貶梅陽衲子中有私地議論之者音首座曰大凡批評議論于人當于有過失之中求段無過道理有過亦可消釋豈可于無過失之中而求有過失雪上加霜耶夫不察妙喜作正法眼藏之心而疑其再貶之跡妄評于人誠何以慰安叢林人耳目公論道理且妙喜平生道風德行才力器量咸出自然天性卓立己身躬行衆事惟以合宜是從其豁達大度本出于人頭地今天道定數自然造化相抑遏之必有個一定至理在矣安得不知其為法門中異日之福案耶諸人聞得首座如此說者從此再不復議論妙喜再貶梅陽之事跡矣音首座謂萬菴曰夫稱善知識當洗濯其心以至公至正接納四來其間有抱道德仁義者雖有讐隙必須進之其或姦邪險薄者雖有私恩必須遠之使來者各知所守一心同德而叢林安矣與妙喜書音首座謂萬菴當洗心接衆以安叢林說夫稱長老行其法化當先將自己個的心肝五臟一一洗雪得乾乾淨淨莫令有一毫染習穢汙然後以至公之法至正之道接納四方其中或有守道養德居仁由義者雖與我有仇讐間隙必須推舉而進用之其或意奸心邪險輕薄者雖與我有私遇殊恩必須屏而疏遠之使四方之來者各自知其道德仁義之所持守萬人一心同其德行而叢林不消命令亦自安泰矣又曰凡住持者孰不欲建立叢林而鮮能克振者以其忘道德廢仁義捨法度任私情而致然也誠念法門凋喪當正己以下人選賢以佐佑推獎宿德疏遠小人節儉修於身德惠及於人然後所用執侍之人稍近老成者存之便者疏之貴無醜惡之謗偏黨之亂也如此則馬祖百丈可侔臨濟德山可逮智林集侔齊也臨濟名義玄黃檗運祖之嗣也德山名宣鑑龍潭崇信之嗣也音首座又曉住持者當正己選賢謙下利人說凡住持者孰不愛建置樹立叢林而少有能振起之者何以故因其道未實悟德不實修而多忘仁無惻隱義不合宜而多廢法度捨之不行私情任之不改而使之然也倘誠思念法道凋零門庭喪敗當端正其心卑以自牧選擇有德以相輔助推獎耆舊而相親疏遠小人而自謹樽節儉約以修己德澤惠施以及人然後左右所用執役侍側之人稍近老成練達者存留之便僻諂者疏外之貴圖無汙醜鄙惡之讒言偏私黨與之攪亂也果能如此則可以與馬祖百丈把手共行臨濟德山同一鼻孔出氣若不是這等樣其孰與之焉音首座曰古之聖人以無災為懼乃曰天豈棄不穀乎范文子曰惟聖人能內外無患自非聖人外寧必內憂古今賢達知其不能免嘗謹其始為之自防是故人生稍有憂勞未必不為終身之福蓋禍患謗辱雖堯舜不可逃況其他乎災禍害也穀善也逃猶免也音首座與妙喜書教當自戒謹以無災為懼說古之至人時自憂惕以無災為懼乃復言曰天道無私豈單棄絶我不善人乎范文正公有言惟是無所不通聖人乃能內外無患倘若不是聖人亦定不能內外全無或外固安寧矣內必有隱憂古今賢人達士知其不能免全無憂患常謹慎之于始時時刻刻以戒忍為墻籬定慧為甲胄常自防衛所以人平居燕處不懈勞心焦思者未必不為一生之福慶矣蓋禍患之與謗辱雖堯舜聖君亦有不仁之謗不孝之辱俱不可逃躲況別者耶宜自謹其始以無災為懼勿以謗辱為懼也萬菴顏和尚曰比見叢林絶無老成之士所至三百五百一人為主多人為伴據法王位拈槌豎拂互相欺誑縱有談說不涉典章宜其無老成人也夫出世利生代佛揚化非明心達本行解相應詎敢為之譬如有人妄號帝王自取誅滅況復法王如何妄竊烏乎去聖逾遠水潦鶴之屬又復縱橫使先聖化門日就淪溺吾欲無言可乎屬菴居無事條陳傷風敗教為害甚者一二流布叢林俾後生晚進知前輩競競業業以荷負大法為心如冰凌上行劒刃上走非苟名利也知我罪我吾無辭焉智林集水潦鶴阿難見比丘誦法偈云若人生百歲不見水潦鶴不如生一日而得覩見之阿難聞已歎曰世間眼滅亦何速乎語比丘言此非佛語不可修行汝今當聽我演佛偈若人生百歲不善諸佛機不如生一日而得決了之比丘持以告師師曰阿難老昏不可信矣當以前誦為是阿難後聞比丘仍前誦習問其故答言吾師告我阿難老昏不可信當以我為是阿難見其不信即入三昧推求勝德無能挽救乃歎曰異哉異哉不可正也屬類也後屬字值遇也知我孔子作春秋以寓王法其大要皆天子之事知孔子者謂春秋之作遏人欲于未萌存天理于既滅為後世慮至深切也罪我罪孔子者以謂無其位而托二百四十二年南面之權使亂臣賊子懼而不敢肆則戚矣萬菴引用以自主條陳不怕人怪的意思萬菴和尚慮道衰法亂叢林無主說比見此時叢林中殊無老練成實之士所到之處或三百一堂或五百一院一人尊居方丈以作堂頭多人共住堂寮以為伴侶主據法座上首白椎長老豎拂似是而非互相欺誑雖有談說而多杜撰不涉典章而無根由宜乎其無老練成實之士也夫首出世間弘道利生代佛吐氣以揚法化非真明自心實達根本行合乎解解合乎行豈可妄為之也耶不見楞嚴經云譬如有一庸人無有實德而稱帝王躡居天子之位是他自取其罪而討誅戮也何況法中之王如何無實道德而妄竊居此法位乎嗚乎誠可悲傷之乎去佛世來愈是差遠水潦鶴之類又復出來縱橫不遵正道使先聖法化門庭日衰一日漸就汩沒我欲不說其可乎值菴居暇日無事僅科條陳列而今傷風敗教之流為法門毒害至甚者一二樁流通敷布于叢林使後生晚進知道前輩是這等樣操履競競戒謹業業恐懼以肩荷背負無上大法為心如履薄冰而恐仆如蹈利刃而恐傷不是苟且圖名求利也知我者以我言為是吾無辭焉罪我者以我言為非吾亦無辭焉吾特慮道衰法亂鞏縣如斯不忍自訥耳萬菴曰古人上堂先提大法綱要審問大衆學者出來請益遂形問答今人杜撰四句落韻詩喚作釣話一人突出衆前高吟古詩一聯喚作罵陳俗惡俗惡可悲可痛前輩念生死事大對衆決疑既以發明未起生滅心也萬菴和尚痛法久成弊說古人上堂說法先舉大法宗旨總綱極要審問大衆學者于此有會則與之印證學者于此不會出來請益問答之來蓋由此也今人却不然先杜撰四句新鮮落韻詩喚作釣話以誘之一人衝突出衆高聲背誦古詩一聯喚作罵陳以為法戰有是理乎俗惡俗惡法微至此而可悲傷道衰於今而可痛惜前輩咸是自念生不知何來死不知何去把作急要緊一樁大事出來對衆決疑既是發明自己大事何嘗起一毫生滅心人我見也萬菴曰夫名行尊宿至院主人升座當謙恭敘謝屈尊就卑增重之語下座同首座大衆請升于座庶聞法要多見近時相尚舉古人公案令對衆批判喚作驗他切莫萌此心先聖為法忘情同建法化互相酬唱令法久住肯容心生滅興此惡念耶禮以謙為主宜深思之萬菴曉主法者識賓主之儀說夫有德名尊長道行耆宿至院或彼專請主者升座說法主者當謙和恭順敘說稱謝設使雁齒原高更要屈尊就卑益加厚重之語說法訖下座同首座并大衆亦禮請客長老升座說法恭聆法要此正禮也每見近時來勝心相軋舉則古人公案令他對衆批評判斷觀其識見如何喚作勘辨他有此禮耶後之王法者切莫萌此勝負心腸有傷風化先聖為法心切彼此忘情其同建立法幢興隆教化或抑或揚互相酬唱令諸佛法久住世間那有貢高心人我見萌動一毛頭許惡業念頭耶賓主之禮以謙下為主當深切思之俾昌二桂報佛祖恩矣萬菴曰比見士大夫監司郡守入山有處次日令侍者取覆長老今日特為某官升座此一節猶宜三思然古來方冊中雖載皆是士大夫訪尋知識而來住持人因參次略提外護教門光輝泉石之意既是家裏人說家裏兩三句淡話令彼生敬如郭公輔楊次公訪白雲蘇東坡黃太史見佛印便是樣子也豈是特地妄為取笑識者監司有司地方官也郡守太守也方冊即語録冊本也萬菴曉主持法道者接納外護要知大體說比見未仕之士已仕之大夫竝監司太守入叢林或有事故處分知事頭首次日報侍者取覆長老今日宜專為某官府上堂說法此一節更宜思而又思可行則行不可行則止古來語録中雖載皆是他士大夫有切于慕道之心自己尋訪知識而來以求發覆住持人因此方便隨機開導若果有真實為法者尊請升座說法又不可辭因其參次略提外護扶助教門光輝泉石之意既是家裏佛法中人亦只尋常擲發點即不到到即不點略說兩三句平實話令彼生敬如郭公輔絶江訪白雲楊次公會芙蓉楷公曰與師相別幾年蓉曰七年公曰學道來參禪來蓉曰不打這鼓笛公曰恁麼則空遊山水百無所能也蓉曰別來未久善能高鑒公大笑蘇東坡詣金山值佛印入室次印曰此間無坐處坡曰借師四大作禪牀師曰老僧有問道得即坐道不得即輸腰間玉帶坡即解帶置案請問師曰老僧四大本空五蘊非有汝向甚麼處坐坡無語印召侍者收取玉帶黃太史見晦堂乞指徑捷處堂曰仲尼道吾無隱乎爾太史如何理會公擬對堂曰不是不是公迷悶不已忽侍堂山行時巖桂盛開堂曰聞木樨花香否公曰聞堂曰吾無隱乎爾公大悟即拜曰和尚老婆心太切堂笑曰只要儞到家耳如上諸公皆是自己為道相訪白雲芙蓉佛印晦堂亦只隨緣應對發覆便是後來法式樣子也豈是無知之輩特地妄為取笑識者耶萬菴曰古人入室先令挂牌各人為生死事大踊躍來求決擇多見近時無問老病盡令來納降欵有麝自然香安用公界驅之因此妄生節目賓主不安主法者當思之決判也擇揀也總是判破疑滯揀擇邪正的意思降服也欵誠也親敬也降欵輸誠盡敬的意思萬菴曉主法者勿仗道抑人說古人入室先令挂牌曉示各人痛為生死大事不能透脫自己奮發踊躍前來以求決擇此正理也每見近時主法不問老者病者盡教他來納降欵不來說是他不服人繩絡有是理乎人有道德禮法如香之有麝自然盡郁馨美何用公界以強之使來耶如此教做妄生枝節條目致使賓主不相調和安靜者多矣主法者宜深思之萬菴曰少林初祖衣法雙傳六世衣止不傳取行解相應世其家業祖道愈光子孫益繁大鑑之後石頭馬祖皆嫡孫應般若多羅懸讖要假兒孫腳下行是也二大士玄言妙語流布寰區潛符密證者比比有之師法既衆學無專門曹溪源流派別為五方圓任器水體是同各擅佳聲力行己任等閒垂一言出一令網羅學者叢林鼎沸非苟然也由是互相酬唱顯微闡幽或抑或揚佐佑法化語言無味如煮木札羮炊鐵釘飯與後輩咬嚼目為拈古其頌始自汾陽暨雪竇宏其音顯其旨汪洋乎不可涯後之作者馳騁雪竇而為之不顧道德之奚若務以文彩煥爛相鮮為美使後生晚進不克見古人渾淳大全之旨烏乎豫遊叢林及見前輩非古人語録不看非百丈號令不行豈特好古蓋今之人不足法也望通人達士知我於言外可矣萬菴曉學人要知大道來源宜法古遵先說少林寺達磨初祖衣法雙傳及到慧能六祖衣乃爭端衣止不傳但傳其法選取行合乎解解合乎行者世世相續以承家業祖宗之道愈見光輝子孫之廣益見繁茂六祖大鑒之後石頭希遷江西馬祖皆面稟親承於青原南嶽是為嫡孫正當西域第二十七代尊者般若多羅遠讖道震旦雖濶無別路道一也要假兒孫腳下行石頭也金雞解銜一粒粟讓祖金雞縣人也供養十方羅漢僧馬祖是四川𨙩邡縣羅漢寺僧正此之是也二大士玄奧之言精妙之語流通敷布於寰區之中潛通暗符密契隱證者每每有之師家之法既爾衆廣學者無專一定法門曹溪一花派分五葉方圓大小任器有殊水體來源則同一味各專敷化咸有芳名用力躬行仁為己任等閒垂示一言出展一令網羅四方學者叢林興盛轟轟烈烈如鼎水騰沸一般不是苟且徒然也由是學者往來宣此通彼宣彼通此互相酬唱顯其微妙闡其幽深或抑而奪或揚則縱贊佐輔佑佛祖法化所說語言全無意味就如煮木札羮炊鐵釘飯一般與後輩咬之不爛嚼之無味喚作拈古到此正法猶存宗旨猶在其頌始自汾州太子院昭祖暨雪竇重顯大弘其頌古之音全彰其頌古之旨汪洋乎如大海之寬深不可涯涘測量矣後之作者亦馳騁雪竇之頌而倣效之不顧自己之道德才學何如一味以華美之言新鮮之句雕巧莊嚴使後昆晚進不復能見古人公案渾厚淳質大全宗旨嗚呼可不矜惜之也乎豫遊行諸叢林中及見前輩典章非古人語録決定不看非百丈清規號令決定不行豈是我特意要好古耶蓋今人說話不由舊章不遵古訓不足以為法也望通理之人達道之士知我於言象之表可矣禮有來源法有授受焉有無根而枝無花而實者乎萬菴曰比見衲子好執偏見不通物情輕信難回愛人己順之則美逆之則疏縱有一知半解返被此等惡習所蔽至白首而無成者多矣已上竝見智林集萬菴曉禪人當圓融豁達通曉物情說每見衲子愛固執一偏之見不通達人情物理才聞一事入耳輒便輕信難得挽回喜人諂奉于己順他則心中喜而美好逆之則心中惡而疏遠縱有一知半解倒被這般惡知惡見所遮蔽到老無成器者甚多矣所以說禪學貴圓融矣萬菴曰叢林所至邪說熾然乃云戒律不必持定慧不必習道德不必修嗜欲不必去又引維摩圓覺為證贊貪瞋癡殺盜淫為梵行烏乎斯言豈特起叢林今日之害真法門萬世之害也且博地凡夫貪瞋愛欲人我無明念念攀緣如一鼎之沸何由清冷先聖必思大有於此者遂設戒定慧三學以制之庶可回也今後生晚進戒律不持定慧不習道德不修專以博學強辨搖動流俗牽之莫返豫固所謂斯言乃萬世之害也惟正因行腳高士當以生死一著辨明持誠存信不為此輩牽引乃曰此言不可信猶鴆毒之糞蛇飲之水聞見猶不可況食之乎其殺人無疑矣識者自然遠之矣與草堂書萬菴為學者摧邪顯正說叢林而時凡所到處邪謬之言如火熾盛乃倡之曰戒律拘身不得脫灑不必持他定慧拘心不得恣意不必習他道本現成德孰缺少不必修他嗜好固常私欲何礙不必去他恐人不信又牽引維摩經云大乘菩薩入諸淫舍示欲之過雖有妻子常修梵行竝圓覺經云一切障礙即究竟覺乃至諸戒定慧及淫怒癡俱為梵行假為證據使人必信嗚呼此等愚言豈僅起叢林今日目前之害真法門中千萬世之害也且大地愚夫愚婦及招提四衆貪婪瞋恚愛染欲情人我無明諸毒念念不息似猿攀枝捨一取一又如一鑊沸湯無由清冷一般以我推察先聖佛祖之意必思衆生三毒利害大有難于降伏者故設戒定慧三無漏學以裁制之庶幾乃可以挽回也今之後生晚進乍入此門無所依據染污其身而戒律不持沉掉其心而定慧不習道理德業俱不操修專務廣覽文字肆口強辨惑俗欺愚往而不返豫故所謂此引維摩圓覺錯解佛語謬證梵行之言乃萬世之毒害也惟是因地端正實為本分行腳高見之士直以生死大事一著子甄別明白持守誠篤懷存信實不為此等惡知惡見之輩所牽引乃自主張之曰此不持戒律不習定慧之言猶如鴆鳥屙的毒糞蛇飲過的毒水這兩種毒物聞見尚不可況食之者乎其殺害于人一定必有無疑矣惡見之流引二經證三毒為梵行者亦猶是也有識者自然不信他惑而遠離之矣萬菴曰草堂弟子惟山堂有古人之風住黃龍日知事公幹必具威儀詣方丈受曲折然後備茶湯禮始終不易有智恩上座為母修冥福透下金二錢兩日不尋聖僧才侍者因掃地而得之挂拾遺牌一衆方知蓋主法者清淨所以上行下效也清泉集萬菴表山堂嚴潔可為後世法說草堂清之法弟子唯山堂行徑有古人之風汜住黃龍日或是知事常住公幹必竟具備威儀才上方丈受他分付畢然後又備茶湯禮從起初及煞閣更不改變中有智恩上座為追薦慈母修幽冥福利遺漏了白金二錢兩期不問聖僧才侍者因灑掃地下而拾得之將挂于拾遺牌之上大衆方才曉得蓋是為主者不好利是這樣清淨所以在下者亦不好利是這樣清淨上行而下效法之也萬菴節儉以小參普說當供衲子間有竊議者萬菴聞之曰朝饗膏梁暮厭粗糲人之常情汝等既念生死事大而相求於寂寞之濵當思道業未辦去聖時遙詎可朝夕事貪叨耶真牧集小參即是晚參也凡集衆開示皆謂之參古人匡徒使之朝夕咨扣無時而不激揚此道故每晚必參則在晡時或住持入院或官員檀越入山或受人請或為亡者開示或四節臘則移于昏鐘鳴而謂之小參小參初無定所看衆多少或寢堂或法堂至午後侍者覆住持云今晚小參令客頭行者報衆挂小參牌昏鐘鳴時鳴鼓一通集衆請者迎住持升座提綱敘謝委曲詳盡舉古結座普說在告香之後普同開示也記萬菴樽節儉約以小參普說當供禪和子有私地議論者萬菴聞得乃警之曰早晨食好晚夕食歹人之常情汝等既痛切生死事大來求決擇共依止于空閒寂寞之鄉當各思忖大道未實悟者速求實悟德業未成辦者速求成辦去佛時遙宜念法微而勤道念豈可朝夕貪叨希圖口腹為事耶萬菴天性仁厚處躬廉約尋常出示語句辭簡而義精博學強記窮詰道理不為苟止而妄隨與人評論古今若身履其間聽者曉然如目覩衲子嘗曰終歲參學不若一日聽師談論為得也記聞記萬菴天資稟性仁慈忠厚處己躬身清廉儉約尋常開示大衆語言詞句簡捷而義理精深遍覽經典勉強記識窮究詳詰正道義理決不苟且休息而虗妄輕隨凡是與人批評議論古今昭昭然就如自己躬履其間一樣聽之者了了然就如親眼看見一般衲子嘗曰終歲勤參苦學不若一日聽師談論古今反為多得也萬菴謂辨首座曰圓悟師翁有言今時禪和子少節義勿廉恥士大夫多薄之爾異時儻不免做遮般蟲豸常常在繩墨上行勿趨勢利侫人顏色生死禍患一切任之即是不出魔界而入佛界也法語辨首座大溈法泰之嗣儻或然之辭有足曰蟲無足曰豸猶言行止的意思繩墨即梓人墨斗中墨線也比況直道的意思萬菴謂辨首座當時行正道勿趨勢利說圓悟師翁有言而今時的禪和子少有節義沒得廉恥所以隱居之士行義大夫見聞多輕薄之爾辨首座他時異日儻或不免做這等樣行止須常常在直道上行不得趨求聲勢才利媚人顏色或生死或禍患到來一切任之不求苟免即是鑊湯中轉大法輪塵勞中作大佛事何更捨魔界而入佛界哉即此直道便是也辨首座出世住廬山棲賢常𢹂一笻穿雙屨過九江東林混融老見之呵曰師者人之模範也舉止如此得不自輕主禮甚滅裂辨笑曰人生以適意為樂吾何咎焉援毫書偈而去偈曰勿謂棲賢窮身窮道不窮草鞋獰似虎拄杖活如龍渴飲曹溪水饑吞栗棘蓬銅頭鐵額漢盡在我山中混融覽之有愧月窟集棲賢屬南康府笻竹杖也屨草鞋也東林屬九江府混融東林寺住持也滅絶也裂壞也太滅裂言絶壞其禮太甚也適如也自得也獰惡也栗棘蓬楊岐示衆云透得金剛圈吞得栗棘蓬便與三世諸佛把手共行歷代祖師同一鼻孔出氣其或未然參須真參悟須實悟也記辨首座出世住廬山棲賢之時常隨身𢹂一笻杖過九江轉東林寺混融長老一見辨即呵之曰師者乃人之楷模防範也舉動安止是這等樣豈不是自輕耶主禮何太滅裂而無體裁也辨笑曰人生以如意為樂我有何過咎焉乃援毫書一偈而回棲賢去偈曰勿謂棲賢窮莫以色見我身窮道不窮我有這個在草鞋獰似虎自西自東拄杖活如龍撐天拄地渴飲曹溪水差勝虎溪饑吞栗棘蓬非是誇富銅頭鐵額漢也有幾人盡在我山中未易放出混融長老見之面有愧色此所謂不經一事不長一智也辨公謂混融曰像龍不足致雨畫餅安可充饑衲子內無實德外恃華巧猶如敗漏之船盛塗丹雘使偶人駕之安於陸地則信然可觀矣一旦涉江湖犯風濤得不危乎月窟集辨公謂混融曉衲子宜修實德說泥塑木雕之像龍豈可使之行雨乎水墨膠青之畫餅詎可得而充饑乎衲子內無真實德行外面恃仗華言巧語以欺愚何以異此又譬如已經敗壞破漏之船多多塗畫五彩丹雘使土木偶人駕之於上張帆捉棹安處陸地之時誠然好看矣一旦放去浮涉三江五湖犯千濤萬浪豈不危險之乎內無實德人外恃華巧者亦猶是也辨公曰所謂長老者代佛揚化要在潔己臨衆行事當盡其誠豈可擇利害自分其心在我為之固當如是若其成與不成雖先聖不能必吾何苟乎月窟集辨公曉住持人當盡其誠不可固必說所謂長老者替佛祖宣揚法化貴在潔己身心以臨大衆發言行事當質直無僞惟盡己誠不可揀擇或利或害自無專主設兩其心在我持誠義所當為即行為之理在如是也若其或成或不成雖是古聖先賢亦不能固必吾安可苟且求成乎辨公曰佛智住西禪衲子務要整齊惟水菴賦性沖淡奉身至薄昂昂然在稠人中曾不屑慮佛智因見之呵曰奈何䖃苴如此水菴對曰某非不好受用直以貧無可為之具若使有錢亦欲做一兩件皮毛同入社火既貧固無如之何佛智笑之意其不可強遂休去月窟集佛智名端裕昭覺勤祖之嗣也水菴名端一佛智之嗣也沖虗也淡淡泊也恬靜無為之貌昂高也昂昂言孤高自如也䖃苴上臘上聲下音鮓中州人謂蜀人不遵軌轍曰䖃苴宜是藞䕢不中貌䕢苴音同社火俗呼會伴也社有聚義社不曰夥而曰火攢柴合火僧多行廣的意思辨公曉禪人當清廉儉約以水菴為法說佛智住西禪寺時衲子形儀衣冠務要嚴潔整齊惟水菴一人稟性沖虗淡泊處身至薄昂昂然超卓自如在多人衆中曾不顧盼憂慮佛智因見其形儀與衆殊異乃呵責之曰奈何藞苴偏見不合時宜不中人意如此耶水菴對之曰端一不是不愛受用特意做此直以赤手空拳貧無可作為之器具若使端一有錢鈔也想得做一件體面衣服同入他門的社火既貧而不可為無末如之何也已矣佛智但笑之而不再言知其賦性不可勉強遂罷休之
