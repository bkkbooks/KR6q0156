body:
  text: 禪林寶訓順硃序季而順硃者何為吾輩見識粗浮只認昭昭靈靈夢幻伴子不真參不實悟不遵先聖禮法不守節義者聊疏前賢之意以自警也又為吾輩參禪者見識卑近參來參去沒有滋味沒有效驗便覧外典習詩習文且求眼前受用倏而鄉校倏而方醫倏而衙掾則禹門三級浪矣何捷如之余痛斯弊故請棲霞山人作寶訓句解先以欲勾牽引之入佛慧焉不意棲霞山人才高識大虧諦釋典不顯淺開喻反成郭象註莊子也見者苦之余于此不忍訥遂效顰出醜順硃填墨一上一以隨所欲而勾入佛慧一以自警云耳故不畏諸方駁笑于戊午夏末槀成常住以俟智士郢政焉爾德玉敘
