body:
  text: 蜀渝華巖季而關聖可德玉順硃佛智裕和尚曰駿馬之奔逸而不敢肆足者衘轡之禦也小人之強橫不敢縱情者刑法之制也意識之流浪不敢攀緣者覺照之力也烏乎學者無覺照猶駿馬無衘轡小人無刑法將何以絕貪慾治妄想乎駿急速也衘馬口中勒鐵也轡馬韁也禦止也佛智和尚示人制貪慾必須覺照說疾馬之遺風迅走而不敢縱足駻突者何葢由馬口有鞿韁而御之也小人之倔彊橫暴而不敢恣縱欲情者何葢由國有典刑以正之也凡人意根法塵所生受想行諸蘊續起之識若急水灘頭之波浪念念流注而不敢攀引緣連者何葢由有諸法寂靜定力一念相應慧力二力以戒止調御之也烏乎學者豈可無定力慧力乎學者若無定力慧力就如那駻馬無羈韁小人無典刑一樣將甚麼把柄去斬絕現前三毒蠲除三世流注妄想也乎此乃修心之實學也駻音幹馬突也鞿音雞韁在馬口也佛智謂水菴曰住持之體有四焉一道德二言行三仁義四禮法道德言行乃教之本也仁義禮法乃教之末也無本不能立無末不能成先聖見學者不能自治故建叢林以安之立住持以統之然則叢林之尊非為住持四事豐美非為學者皆以佛祖之道故是以善為住持者必先尊道德守言行能為學者必先存仁義遵禮法故住持非學者不立學者非住持不成住持與學者猶身之與臂頭之與足大小適稱而不悖乃相須而行也故曰學者保於叢林叢林保於道德住持人無道德則叢林將見其廢矣實錄佛智謂水菴主法大體要知根識本說住持之體有四焉一是日用所當行之道并尋常所涵養之德二是開發後進之言并躬身履踐之行三是慈愛惻隱之仁與裁制合宜之義四是節臘省會之禮與揵推號令之法前二種道德並言行乃是教之根本也後二種仁義並禮法乃教之枝葉也若無根本憑何樹立若無枝葉不能完成的的要成一株大樹蔭覆天下人不可不曉此根本也先聖見參學之輩不能自己修治故建豎叢林高堂廣廈以安養之設立住持高賢碩德以統理之然則一寺稠人廣眾之尊非是獨為住持一人飲食衣服臥具湯藥四事豐盛非專為學者既不為此畢竟所為那樣皆因為佛祖慧命之道故是以能擔任斯道把作件事以為住持者必竟先務尊重道德操守言行以為根本善勤求此道把作件事以為學者必竟先務存懷仁義遵依禮法以為枝葉故住持人若無學者則智慧花果從何而得設立學者若無住持則菩提種子從何而得生成所以住持之與學者就如人有身有臂有頭有足四肢百骸五臟六腑大小適意稱心而不相違悖乃相須相待而行之者豈不成一株大大人樹也哉爍然有根有本有枝有葉智慧花果菩提種子咸從此相待而生佛祖慧命生生相續寧有窮也故曰學者保守於叢林叢林保守於道德兩相保守也住持人若是沒有道沒有德則叢林欲其本末堅茂始終永興而不廢者未之有也水菴一和尚曰易言君子思患而預防之是故古之人思生死大患防之以道遂能經大傳遠今之人謂求道迂濶不若求利之切當由是競習浮華計較毫末希目前之事懷苟且之計所以莫肯為周歲之規者況生死之慮乎所以學者日鄙叢林日廢紀綱日墜以至陵夷顛沛殆不可救嗟乎可不鑑哉雙林實錄陵夷言法道頹替若丘陵之漸平也水菴一和尚示人生死大事當預先打點莫臨時著忙說易經水火既濟卦云成德君子心中時時慮患而預先謹微杜漸以防之是故古之人時時思慮生不知何來死不知何去此是人極大的患乃防之以直指人心日用所當行之正道遂能擔當大事流通久遠今之人不知道之極致反謂求道迂遠曠濶不能濟眼前饑寒之急不若求財利即得現前受用之切當也由是競進尚習浮費奢華計算毫釐比較瑣末希求眼下之事而不廣大懷存苟且之計而無恒心所以不肯立身行事為一年之規者豈識亘古亘今廣大恒久不生不死之妙道哉是故學者見識日見卑鄙叢林法度日見廢壞總綱眾紀日見隳墜以至頹替傾覆危殆至于不可拯救之地有不忍見聞者嗟乎可不鑑照之乎有志于道者宜以自己反觀之智鑑而照察之其妍醜自然分明矣水菴曰昔遊雲居見高菴夜參謂至道徑挺不近人情要須誠心正意勿事矯飾偏邪矯飾則近詐偏邪則不中正與至道皆不合矣竊思其言近理乃刻意踐之逮見佛智先師始浩然大徹方得不負平生行脚之志浩廣也浩然大徹言無所不通的意思水菴與月堂書言人造道心要極正說昔行脚遊雲居見高菴一夕夜參云無上至道徑直挺特不循人情要當真誠其心端正其意不得有事矯妄裝飾偏僻私邪矯飾則幾于詐之流偏邪則入不中正之類與無上至道猶方底而圓葢必不合矣予竊想此小參之言近于道理乃銘刻於意地踐行之及見佛智先師一言之下心地開通始得不孤負予一生登山涉水行脚的志向矣水菴曰月堂住持所至以行道為己任不發化主不事登謁每歲食指隨常住所得用之衲子有志充化導者多却之或曰佛戒比丘持鉢以資身命師何拒之弗容月堂曰我佛在日則可恐今日為之必有好利者而至於自鬻矣因思月堂防微杜漸深切著明稱實之言今猶在耳以今日觀之又豈止自鬻而已矣法語月堂名道昌妙湛惠嗣也食指即人手第二指也未齒嬰孩常自乳𠾱者言人人本有的意思鬻賣也水菴戒人勿事貪求說月堂和尚凡所到一處只以行佛祖之道為自己重任不遣僧人募化錢穀不登貴門謁見士夫每年用度自食各人本有分段隨常住所得多寡豐儉大家受用衲子中有發志願充化主導誘檀越者堂多却之而不許或者從旁而諫之曰佛在世時曾命持戒比丘入城拓鉢以資養身命師是何緣故却之而不許月堂遂敘說不許之由而答之曰我佛在世之日感化者眾日中一食僧唯參究己躬而無異念萬人一心故可今時之人多貪名利不切己事只恐今日為之必有好利之徒假公濟私者而至於自賣故不許矣予因思想月堂防閑細微杜絕漸進其操心也危而深切其慮患也深而著明此誠適稱諦實嘉言也幸今言猶在耳以而今時節看來吾儕弊病又豈只於自鬻而已哉更有甚焉者皆自募化始矣水菴謂侍郎尤延之曰昔大愚慈明谷泉琅琊結伴參汾陽河東苦寒眾人憚之惟慈明志在於道曉夕不怠夜坐欲睡引錐自刺歎曰古人為生死事大不食不寢我何人哉而縱荒逸生無益於時死無聞於後是自棄也一旦辭歸汾陽歎曰楚圓今去吾道東矣西湖記聞河東即太原汾州屬太原也苦寒嚴寒也憚畏難也尤延之姓尤名袤字延之號遂初居士問道於水菴一和尚者荒怠荒逸懈怠也水菴引古人忘身為法精進不已而謂尤延之說昔大愚芝慈明圓谷泉道琅琊覺結伴混火隊而去參汾陽昭祖之時河東苦寒眾人志氣劣弱而生憚惟慈明志向廣遠念茲在茲朝勤夕惕無一刻休息懈怠念頭夜坐之間或欲瞌睡乃引出利錐以自刺可謂得精進三昧而能純一不已者也又嘗歎曰古人實切痛念生不知來死不知往這一樁大事日切於斯而忘食夜切於斯而忘寢尚是這樣我何人哉而敢恣縱怠惰現生之日若無實德利益于當時逮死之時亦無美名傳聞于後世是自己廢棄也成得甚人一日辭汾陽乃嘉歎曰楚圓今去吾道東行亦與之俱往矣其汾陽昭祖推重他而又深許全喏是如此非虗譽也水菴曰古德住持率己行道未嘗苟簡自恣昔汾陽每歎像季澆漓學者難化慈明曰甚易所患主法者不能善導耳汾陽曰古人淳誠尚且三二十年方得成辦慈明曰此非聖哲之論善造道者千日之功或謂慈明妄誕不聽而汾地多冷因罷夜參有異比丘謂汾陽曰會中有大士六人奈何不說法不三年果有六人成道者汾陽嘗有頌曰胡僧金錫光請法到汾陽六人成大器勸請為敷揚西湖記聞及僧傳率尊也苟且也草率的意思簡忽慢也異比丘聖僧也胡僧即異比丘金錫所持之錫杖也光光降也水菴引古以示禪人當身體力行精進于道者必感龍天護助說自古先賢有道德者主宰叢林維持法化尊率己躬力行祖道未嘗苟且簡略以自恣縱不見昔日汾陽昭祖每每歎息像法住世叔世時節世既澆漓時亦淺薄學人隨時世而遷變不如上古所以難得教化慈明曰不然人為物靈却甚易也所患是主張法道者不能勤劬以誘致之耳汾陽又曰上古之人淳素誠篤尚且要二三十年之久方纔打成一片搆副此事慈明曰此是和尚拒諫之言非聖人哲士之所論也若是肯發大心勇猛精進極力于道者直消千日工夫可以成就或者謂慈明斯言虗詐不肯聽信而汾州之地近北多寒因而遂罷夜參焉忽有一異比丘不知何來而謂汾陽曰法會之中有六個好人可成大器云何不語他說法而廢棄夜參耶迄後不及三年果然有六人成辦道業者汾陽因此而有頌云胡僧金錫光言西來之胡僧持金錫而光降也請法到汾陽言特為佛法而來此也六人成大器言慈明圓大愚芝瑯琊覺谷泉道法華舉天勝泰此六人可成大器也勸請為敷揚言勸請仍舊說法激勵此六人更不可廢罷夜參也肯盡力於道者龍天讚助如是季而謂異比丘得非清涼妙德之應現歟不然則何以預知未來業報智力不爽矣投子清和尚畫水菴像求贊曰嗣清禪人孤硬無敵晨昏一齋脇不至席深入禪定離出入息名達九重談禪選德龍顏大悅賜以金帛力辭者三上乃嘉歎真道人也草木騰煥傳予陋質炷香請贊是所謂青出於藍而青於藍者也見畵像投子名義清水菴之嗣也選德內宮之殿名也上君王也青出于藍言染青出於藍靛而青更勝過於藍靛也比況徒愈于師的意思記投子清畫水菴和尚幀子求贊水菴贊曰法嗣義清禪人孤高剛硬第一晨昏一日一餐長坐身不臥席深入四禪九定如死不見呼吸名聞通于帝庭說法談禪選德感動天子懽喜賜他金銀幣帛極力辭却三番君乃嘉美稱嘆真果是個道人草木輝騰煥爛今日傳我鄙形燒香請我自贊此正所謂青染本出藍靛而青更深於藍靛者也自贊切忌自贊譽徒即是譽己水漲船高矣水菴曰佛智先師言東山演祖嘗謂耿龍學曰山僧有圓悟如魚之有水鳥之有翼故丞相紫巖居士贊曰師資相可希遇一時始終之分誰能間之紫巖居士可謂知言矣比見諸方尊宿懷心術以御衲子衲子挾勢利以事尊宿主賓交利上下欺侮安得法門之興叢林之盛乎紫巖居士名張浚字德遠紹興初拜封和國公問道於圓悟勤祖也水菴引前聖師資契分人莫能間而謂梅山潤說佛智先師曾言東山演祖嘗謂耿龍學曰山僧未得人時如魚涸轍鳥無翎羽今有圓悟如魚得水而可騰躍如鳥有翼而可翀舉一般故紫巖居士贊之曰師以道授于弟子弟子資受於師兩相契合皆自肯可實乃千載一時奇特之遇非偶然也從始至終有一定的素分是誰得而間隔之哉紫巖居士可教做知人之人而始發此贊美之言矣予每見近來諸方尊宿懷心術以御使四方衲子四方衲子挾持勢力財利以奉事尊宿上而主人下而賓客交相取利上欺於下下欺於上焉能得法席之興隆如魚之有水叢林之盛旺如鳥之有翼也乎水菴曰動人以言惟要真切言不真切所感必淺人誰肯懷昔白雲師祖送師翁住四面叮嚀曰祖道凌遲危如累卵毋恣荒逸虗喪光陰復敗至德當寬容量度利物存眾提持此事報佛祖恩當時聞者孰不感慟爾昨來召對宸庭誠為法門之幸切宜下身尊道以利濟為心不可矜己自伐從上先哲謙柔敬畏保身全德不以勢位為榮遂能清振一時美流萬世予慮光景不長無復面會故此切囑見投子書凌冰也遲緩也非宜零弛言零落廢弛也宜陵夷言道替如陵之平也累卵晉靈公建九層之臺三年不起有荀息諫曰臣能累十二棊子又加九卵於上公曰危哉息曰不危公造九層之臺三年不成男不耕女不織其危更甚言祖道之危亦類乎此宸帝宮也伐誇也水菴引祖言以勉投子當謙下尊道以利濟為心說感動於人的言語惟要真實切當若言不真實切當所以感動於人必定膚淺而人亦不肯懷仰也昔白雲師祖送演師翁住持四面之時叮嚀囑咐之曰祖宗之替道如陵阜之漸平其危殆又如十二棊上累九卵一樣毋得恣意怠荒放逸花費眼前日子復損自己大德宜寬而不猛容而不隘量其出入度其可否廣利庶人存護大眾提持生死大事報答佛祖殊恩當是時聞之者是那一個不感懷慟念爾昨來奉至尊召命趨對天子宸庭誠為法門中慶幸尤宜謙恭重道以廣化利益一切為心不可矜己自負誇張聲勢也從上先賢謙卑柔順敬謹慎畏明哲保身全備厚德總不誇張勢位以為榮顯所以能清聲振揚於當時美名流芳於萬代耳予自慮生程有限老景無多恐不復再有面會之期矣故此叮嚀諄囑水菴少倜儻有大志尚氣節不事浮靡不循細檢胸次岸谷徇身以義雖禍害交前不見有殞穫之色住持八院經歷四郡所至競競業業以行道建立為心淳熈五年退西湖淨慈有偈曰六年灑掃皇都寺瓦礫翻成釋梵宮今日宮成歸去也杖頭八面起清風士庶遮留不止小舟至秀之天寧未幾示疾別眾告終行實殞音允穫黃入聲倜儻音剔倘卓異也浮靡任從奢費也循順也徇殉同從也以身從道也殞非宜隕從高墜也穫刈禾也隕穫困迫失守也取禮儒行不隕穫於貧賤之意同隕如蘀之隕而飄零穫如禾之穫而枯槁也不隕穫言不遷變的意思記水菴年齒少稚之時雅致慷慨瀟洒無羈有遠大志向氣勢節操不事好浮溢奢靡不循順檢校毫末胸次沖虗就如高崖深谷空豁豁的而且一般徇身從義不知有軀雖是大禍大害交加于前總不見有遷變失守的顏色可謂得大無畏人矣住持八所叢林經歷四大郡府凡到之處競競戒謹業業危懼惟以力行祖道建立法化為心其有功於末運大矣淳熙五年退臨安西湖淨慈寺出院時有偈云六年灑掃皇都寺時孝宗都臨安故稱皇都也瓦礫翻成釋梵宮昔為敗壞瓦礫之地翻然成釋迦梵剎宮殿今日功成歸去也功成名遂身宜當退杖頭八面起清風言去住自由拄杖一行清風八面從橫無礙也此偈寓意有辭世之心士庶強為遮攔稽留不能止一葉扁舟飄飄而去徑抵嘉興府秀水縣天寧寺無何示微疾升堂別眾入寂滅定焉月堂昌和尚曰昔大智禪師慮末世比丘驕惰特製規矩以防之隨其器能各設攸司主居丈室眾居通堂列十局頭首之嚴肅如官府居上者提其大綱在下者理其眾目使上下相承如身之使臂臂之使指莫不率從是以前輩遵承翼戴拳拳奉行者以先聖之遺風未泯故也比見叢林衰替學者貴通才賤守節尚浮華薄真素日滋月浸漸入澆漓始則偷安一時及玩習既久謂其理之當然不謂之非義不謂之非理在上者惴惴焉畏其下在下者睽睽焉伺其上平居則甘言屈體以相媚悅得間則狠心詭計以相屠獪成者為賢敗者為愚不復問尊卑之序是非之理彼既為之此則傚之下既言之上則從之前既行之後則襲之烏乎非彥聖之師乘願力積百年之功其弊固則莫能革矣與舜和尚書惴音贅睽音奎獪古外切攸司所主也十局頭首局曹也部分也使各司其局也西序知事五局一首座二書記三知藏四知客五侍者東序知事五局一都監事二維那三副寺四典座五直歲也翼恭也戴頂戴也拳拳奉持也惴憂懼也睽斜視也屠宰殺也獪害也襲合也月堂和尚曉住叢林者當遵行先聖禮法說昔百丈大智和尚慮末法世時比丘驕奢懶惰特製肅眾規矩以防閑之隨其器量才能各設所主之部分主法尊居方丈廣眾萃處通堂東西敘列知事頭首之尊嚴恭肅猶如官家府衙一樣居上者單提大法綱要在下者葺理庶物條章必使上之與下迭相扶持又如一身使兩臂兩臂使十指無不尊率依從一般以是之故前輩遵承典刑翼戴禮法拳拳服膺佩奉行持者以大智先聖之清淨芳規遺餘風汜未曾泯滅故也比來只見叢林道衰法替學者只以通才學為貴重以守節操為卑賤浮靡華飾習而尚之素朴真淳蔑而薄之蛇飲日滋蠱水月浸漸漸澆漓深入膏肓致令針灸藥餌俱不能及始猶不覺不過上下偷安于一時及乎翫愒歲月習染日久反以為是安之無愧不謂不是合宜之義不謂不是正道之理在上的不免憂恐而怕下檢在下的則傍窺觀望以伺上隙恬然無事時則巧言蜜語以相諂諛得個縫罅則狼心狡意以相殘害或事有僥倖而成立者彼此咸誇伐以為賢若事乖違而敗壞者彼此誚責以為愚那裏更有尊長卑幼之序次善是惡非之道理彼若惡作胡為此亦無慚效法下既胡言亂說上亦無恥依從一唱百和前行後襲烏乎可不痛傷之也乎倘不是三賢十聖一切智人乘十大行願十大智力積累百年功勛其結固弊病恐亦不能改革矣其誰能遏人欲于未萌存天理于未著哉月堂住淨慈最久或謂和尚行道經年門下未聞有弟子得不辜妙湛乎月堂不對他日再言之月堂曰子不聞昔人種瓜而愛甚者盛夏之日方中而灌之瓜不旋踵而淤敗何也其愛之非不勤然灌之不以時適所以敗之也諸方老宿提挈衲子不觀其道業內充才器宏遠止欲速其為人逮審其道德則淫汙察其言行則乖戾謂其公正則邪侫得非愛之過其分乎是正猶日中之灌瓜也予深恐識者笑故不為也北山記聞淤音迂挈牽入聲妙湛名思惠法雲善本之嗣也記月堂和尚住持臨安淨慈多年或者謂師行此授受之道最久門庭之下不見有繼續慧命弟子寧不辜負妙湛之所托囑乎月堂意謂續法要當重法絕法實由輕法也彼豈知此乎乃默而不答他日又重問之月堂乃曰我與你說個譬喻如人種瓜而愛惜之極正當中夏大熱之時日正中天而用水澆灌之足未離瓜之園而瓜已苗萎根爛了也何故葢其愛惜慇心非不勤劬然而灌澆徒為實匪時候不惟無益于助養而反有害乎根荄今諸方長老提𢹂挈持禪衲不觀其道行德業福慧果內充否才能器量作為果廣遠否此咸不論只欲迅速出頭為人及審識其道德則淫溢穢污而不堪詳察其言行則乖違背戾而不當謂其公正則私邪便而無恥寧不是愛惜學者之太過其分乎如是愛人正如日當中天去灌瓜一般樣也予深恐有見識者恥笑也是這等樣故寧可辜於先師而不敢為也或人宜可以鑑我之心矣萎音葦荄音皆月堂曰黃龍居積翠因病三月不出真淨宵夜懇禱以至然頂煉臂仰祈陰相黃龍聞之責曰生死固吾分也爾參禪不達理若是真淨從容對曰叢林可無克文不可無和尚識者謂真淨敬師重法其誠至此他日必成大器北山記聞月堂曉學者宜尊師重法說昔黃龍南和尚居住積翠叢林之時因染重病三月之久不愈未出方丈真淨至子夜潔澣身心懇禱三世諸佛以至頂上剜燈兩臂然香仰祈暗裏陰相福祐黃龍聞真淨如此乃呵責之曰我之生死本吾之分定也當生任生當死任死爾參禪做甚不通達此個道理若是真淨從容和緩而對曰叢林之中克文無益於人可以無者和尚開導十方禪衲承佛慧命可一日無耶識者謂真淨孝敬師承尊重大法其真誠專篤所以至此他日必竟是成大美器的季而謂世諦中臣損軀以事君子竭力以事父者多矣未見徒之事師如此其專且篤也真淨可謂出世諦中千古來一人矣月堂曰黃太史魯直嘗言黃龍南禪師器量深厚不為事物所遷平生無矯飾門弟子有終身不見其喜怒者雖走使致力之輩一以誠待之故能不動聲氣而起慈明之道非苟然也一本見黃龍石刻月堂曉主法者當豁達胸襟以誠待人說黃山谷居士曾言黃龍南公器深叵測量廣有容不為一切事物之所遷移一生行履總無矯奢修飾之態門下徒弟學人一個個本色老成且不見其有輕喜輕怒者況南公乎雖走作小使効勞盡力之輩亦以誠實念頭待他非得一子地而何所以能不大聲以色而振起慈明圓祖之道豈苟且徒然歟有容量有誠念使之然也月堂曰建炎己酉上巳日鍾相叛於澧陽文殊導禪師厄於難賊勢既盛其徒逸去師曰禍可避乎即毅然處於丈室竟為賊所害無垢居士拔其法語曰夫愛生惡死人之常情惟至人悟其本不生雖生而無所愛達其未甞滅雖死而無所畏故能臨死生禍患之際而不移其所守師其人乎以師道德節義足以教化叢林垂範後世師名正導眉州丹稜人佛鑒之嗣也一本見廬山岳府惠大師記門建炎宋高宗年號上巳日三月初三日也鍾相洞庭湖叛賊也澧陽常德府澧州也逸奔也毅果敢也強忍也至到也至人言到地頭的人也月堂曉人處死生禍害之際要有操守主見說建炎己酉三月初三鍾相作亂於澧陽傷殘人民文殊正導禪師厄于難焉師先於建炎三年春日上堂示眾舉臨濟終時囑三聖因緣曰正法眼藏瞎驢滅臨濟何曾有此說古今時人皆妄傳不信但看後三月果到後三月賊勢既盛其徒眾欲與師南奔師云學道所以了生死斯禍已及詎可避乎徒眾俱去師即毅然果決處于丈室之中賊至師云速當殺我快汝心意賊舉槊刺之血皆白乳賊驚駭引蓆覆之而去無垢居士䟦其法語曰夫喜愛其生厭惡其死凡人常情惟是到地頭人悟其四大元非有非有誰當此生雖與眾同有此生而了無愛好之心達其五蘊本來空既空誰當此死雖與眾同有此死而了無有畏懼之念故能臨生死禍患交加于其前預知報謝毫髮不爽而總不遷改其所守之志師真其得道之人乎以師道高德重守節而生仗義而亡足以振起末運風化叢林垂之千載萬年模範後世焉師葢四川眉州丹稜縣人法名正導佛鑒惠懃和尚之嗣也學者當知師之道德節義亦應知其所自矣槊音朔矛也心聞賁和尚曰衲子因禪致病者多有病在耳目者以瞠眉努目側耳點頭為禪有病在口舌者以顛言倒語胡喝亂喝為禪有病在手足者以進前退後指東劃西為禪有病在心腹者以窮玄究妙超情離見為禪據實而論無非是病惟本色宗師明察幾微目擊而知其會不會入門而辯其到不到然後用一錐一劄脫其廉纖攻其搭滯驗其真假定其虗實而不守一方便昧乎變通俾終踏於安樂無事之境而後已矣實錄心聞名雲賁育王介諶之嗣也瞠直視貌劃剖也剖判分說的意思錐刺也劄宜扎拔也搭滯言凝止不脫灑的意思心聞賁和尚直心直行破學者禪病以顯直指綱宗說衲子因參禪而致病者極多略而言之則有四焉一有病在耳目者則認色塵為道而瞠眉努目又認聲塵為道而側耳點頭以為禪焉二有病在口舌者則認舌為道而顛言倒語認口為道而胡喝亂喝以為禪焉三有病在手足者則認脚為道而進前三步退後三步認手為道而指東劃西指西劃東以為禪焉四有病在心腹者則認蘊心為道而擬窮玄究妙認空腹為道而擬超見離情以為禪焉總此四者據實評論種種謬解無一非病者惟本色本分宗師燭圓明眼洞觀察智知幾知微纔一見而即知他有見解無見解纔入門而即知他到地頭不到地頭然後或用一錐刺膏肓病或用一劄截我慢幢或用金剛劍斬斷𦆆纖或用奮迅機掃除搭滯或用無塵鏡顯真現假或用無礙辨練實搗虗而決定不令守于一方便令得無量巧方便決定不令昧乎變通而令得無量巧變通使究竟行到刀兵饑饉水火三災所不及之處空無作無願三解脫之境而後已矣心聞曰古云千人之秀曰英萬人之英曰傑衲子有智行聞於叢林者豈非近英傑之士邪但能勤而參究去虗取實各得其用則院無大小眾無多寡皆從其化矣昔風穴之白丁藥山之牛欄常公之大梅慈明之荊楚當此之時悠悠之徒若以位貌相求必見而詒之一旦據師席登華座萬指圍繞發明佛祖叔世之光明叢林孰不望風而靡矧前輩皆負瓌偉之材英傑之氣尚能區區於未遇之際含恥忍垢混世同波而若是況降茲者歟烏乎古猶今也此猶彼也若必待藥山風穴而師之千載一遇也若必待大梅慈明而友之百世一出也葢事有從微而至著功有積小而成大未見不學而有成不修而先達者若悟此理師可求友可擇道可學德可修則天下之事何施而不可古云知人誠難聖人所病況其他乎與竹菴書風穴名延沼錢塘餘杭劉氏子南院顒祖之嗣也白丁地名地多小人風穴隱于其間人無知者大梅名法常馬祖之嗣也悠悠行貌詒音太欺詒狂詐也叔世季世也靡偃也矧況也瓌偉大也心聞和尚曉學者親師擇友當積功累行造道修德說夫英傑之士詎尋常人哉古謂有千人之秀美纔教做英士有萬人之英才方教做傑士凡衲子有智慧德行之名聞播聞于叢林中者豈不是幾于英才俊秀之士耶但能精而不已進而不退朝如是參夕如是究去其虗浮取其實行各有智行得而用之則又何必論他大院小院大眾若多若寡皆自來歸從其所化矣溯而觀之昔風穴之未出世也住於白丁之時藥山之未出世也住於牛欄之時常公之見馬祖後隱於大梅時慈明之未應黃公之請也放意荊楚時當此之時尋常途路未到家之輩詎識之哉若以位而無位貌而無貌以是相求必見而欺慢之忽一日龍天推出陞寶華座據無畏牀千人圍繞四眾歸依展母陀羅臂發大用開師子王口明大機彰顯佛祖季世之光明諸方法社誰不望風而偃如水就下而莫之止也矧前聖皆抱負瑰美偉大之英材千秀萬英之氣槩尚且碌碌于不得地之際含容恥辱忍受垢浼同流合污隨波逐浪而若是況降茲以下者歟烏乎可不感悟槩慕之也乎古人猶今人也此時猶彼時也若必定要待風穴之混俗同塵藥山之皮膚脫盡而師之不易多見千載一遇也若必定要得大梅之高尚其志慈明之倜儻不羈而友之亦難多逢百世一出也葢事有從微細一法之不明而參究至於法法彰著無所不明功有積一念之小善而成念念不斷至高莫測之大善未見有一念不積學而欲其善道有成一法不造詣而欲其自心通達者若徹悟此個道理何高師而不可求何良友而不可擇何大道而不可學何德業而不可修則凡天下一切事事法法何所施而不可哉古云知人誠難聖人且有患不知人之病況非聖哲者乎親師擇友固難而積德累行亦未易易矣心聞曰教外別傳之道至簡至要初無它說前輩行之不疑守之不易天禧間雪竇以辯博之才美意變弄求新琢巧繼汾陽為頌古籠絡當世學者宗風由此一變矣逮宣政間圓悟又出己意離之為碧巖集彼時邁古淳全之士如寧道者死心靈源佛鑒諸老皆莫能迴其說於是新進後生珍重其語朝誦暮習謂之至學莫有悟其非者痛哉學者之心術壞矣紹興初佛日入閩見學者牽之不返日馳月騖浸漬成弊即碎其板闢其說以至祛迷援溺則繁撥劇摧邪顯正特然而振之衲子稍知其非而不復慕然非佛日高明遠見乘悲願力救末法之弊則叢林大有可畏者矣與張子韶書下出廣錄騖音務天禧宋真宗年號籠養鳥之籠絡鞿馬之絡即羅致學人的意思宣政宋徽宗年號碧巖山名集書名是圓悟勤祖在此山作評唱釋雪竇頌古為碧巖集也寧道者名道寧演祖之嗣也紹興宋高宗年號佛日即妙喜也閩福建也疾驅曰馳亂馳曰騖馳騖言放勢已久而難收的意思漬浸也祛却也開也劇甚也心聞曉學者辯評唱之謬以明直指之道說初祖西來直指之旨昔阿難問迦葉世尊傳金襴袈裟外別傳何物迦葉召阿難阿難應諾迦葉云倒却門前剎竿著阿難於言下契證投機名曰教外別傳傳至西二十八祖來東土是為初祖惟一味以此言下契證投機接續授受臨其丁寧告誡之際則但曰行合乎解解合乎行行解相應名之曰祖初有何說前輩如此行持之而不疑惑抱守之而不遷改迄宋天禧間雪竇顯以辯黠博達之才美資任意變化賣弄求取新鮮琢磨巧妙繼踵汾陽之后而作頌古羅致當代學者宗風由此之故直指而變為曲指了矣逮宣政間圓悟勤祖又出自己胸襟評論提唱雪竇頌古名為碧巖集焉彼是時有超今越古淳心全德之士如寧道者死心新靈源清佛鑒懃諸大老皆不能挽回其說以此之故乍入初學新戒後生如珍如玉貴重其語朝而誦讀暮而習學謂以為至極學問莫有人省得以為不是者痛哉學者之心術如油入而不可復救矣紹興初佛日杲和尚入福建見得學者為評唱所引不肯轉頭日馳月騖如野馬疾驅而難收時浸刻漬如蠱水入喉而成病即碎焚其碧巖集之板非其評唱之謬以至却開迷雲援拯陷溺剔削繁興撥置危劇打破荊山之石顯出連城之寶卓然而振起之衲子稍稍知道評唱之非而不復更慕倘不是佛日這等高明這等遠見乘四無量悲心十大行願十大智力救斯末法之積弊則叢林安得復有直指之道哉誠有可懼焉者矣佛日可謂有功於斯道不小也拙菴佛照光和尚初參雪堂於薦福有相者一見而器之謂雪堂曰眾中光上座頭顱方正廣顙豐七處平滿他日必為帝王師孝宗皇帝淳熈初召對稱旨留內觀堂七宿待遇優異度越前來賜佛照之名聞於天下記聞顱音盧頥音夷拙菴佛照名德光大慧杲嗣也顱頭骨顙額也頷也七處兩手兩足兩肩及頂也記佛照光和尚乍入叢林到饒州薦福寺參雪堂和尚時有相者纔一看見而器美之乃謂雪堂曰廣眾之中德光上座頭頂方而且正額頷寬而竝豐兼上而頂顱中而肩手下而兩足七處平正圓滿異日必竟做國師去在此人相貌已載就了也及宋孝宗即天子位淳熈初召光入對果如上意留在內觀堂中七期始出其欵待覯遇優饒特異如此光歸住育王上又遣人度越前來賜他佛照之號播聞於天下焉此記言福有因果多是修來故有斯相名非苟求也覯音逅拙菴謂虞允文丞相曰大道洞然本無愚智譬如伊呂起於耕漁為帝王師詎可以智愚階級而能擬哉雖然非大丈夫其孰能與焉與去聲虞允文丞相字彬甫幼能詩詞有驚人句上命置翹村舘以筵天下士焉拙菴乃謂虞丞相選賢之法宜以德取勿以名位取說大道之在天地而稟賦於人也原來空空洞洞本無有愚亦無有智譬如伊尹耕于有莘之野湯三使聘之拜以為相又如呂望姜尚釣于磻溪因西伯獵得立為帝師以二賢觀之豈可以聰智愚拙階梯等級而能比擬之哉雖然如是倘不是這等樣沒量漢具惻隱心備精一道其餘孰為輕許之焉誠哉取賢當慎輕名位若輕以名位許人則求名者至也賢安在哉拙菴曰璇野菴常言黃龍南禪師寬厚忠信恭而慈愛量度凝遠博學洽聞常同雲峯悅遊湖湘避雨樹下悅箕踞相對南獨危坐悅瞋目視之曰佛祖妙道不是三家村古廟裏土地作死模樣南稽首謝之危坐愈甚故黃太史魯直稱之曰南公動靜不忘恭敬真叢林主也幻菴集箕踞人傲坐形如箕也拙菴曉學人四儀胸臆當以南公為法說璇野菴嘗言南公寬舒厚重忠實篤信身常恭肅而慈愛一切胸中豁達而凝定深遠博覧學業周洽多聞甞同雲峯悅公偕行到湖廣湘陰避雨樹下悅公長伸兩足其形似箕相對踞坐南公獨端正一心其形如杌跏趺而坐悅公以友道自任恐南公偏執乃瞋目直視以誚之曰佛祖無上大道豈是執相拘形不明其理可成就耶若執相拘形為道則三家村裏并古廟前的石土地俱皆是佛也詎可做恁麼死模樣以為道耶此亦責善之正理也南公却也是明理而有本據的人見悅公說得當理乃稽首謝之仍復孤危獨坐愈加莊重故太史黃山谷曾稱贊之曰南公不是擔板漢動也如斯靜也如斯是這等樣不忘恭肅敬慎誠可以為叢林中教化之主也拙菴曰率身臨眾要以智遣妄除情須先覺背覺合塵則心蒙蔽矣智愚不分則事紊亂矣晝監寺書拙菴曉人修身利人除妄遣情之理說循順自己本有之理以臨蒞廣眾利益於人必竟要有大智慧遣逐無量劫來所積妄想并現在念念不息情識必竟要預常覺照若違背覺照不求見佛不隨明導而合塵勞則心蒙蔽而不明白矣智慧愚魯君子小人不分清濁則事事法法差謬紊亂矣拙菴曰佛鑑住太平高菴充維那高菴齒少氣豪下視諸方少有可其意者一日齋時鳴揵見行者別器置食於佛鑑前高菴出堂厲聲曰五百僧善知識作遮般去就何以範模後學佛鑑如不聞見逮下堂詢之乃水虀菜葢佛鑑素有脾疾不食油故高菴有愧詣方丈告退佛鑑曰維那所言甚當緣惠懃病乃爾甞聞聖人言以理通諸礙所食既不優於眾遂不疑也維那志氣明遠他日當柱石宗門幸勿以此芥蔕逮佛鑑遷智海高菴過龍門後為佛眼之嗣虀音齎犍音乾揵舉也舉椎擊之也揵椎者鐘板磬魚并引磬所以起止禮法之節度也去就猶行止也柱牚也支也柱石者言牚支法門安如磬石也芥蔕小梗也梗鯁同直也世謂謇諤為骨鯁謂直言難受如骨之咈咽也拙菴舉高菴維那氣豪梗直佛鑒和尚有山海胸襟說佛鑒主舒州太平時高菴為維那高菴的年齒少小志氣豪壯下視於人鮮有稱如他的意者忽一日過堂喫齋正鳴揵椎之際見行者別樣噐皿奉菜食堂頭之前高菴乃高大其聲曰半千人堂頭做與麼行止怎能矜式後學高菴一時忍俊不禁只顧理之是未見事之詳此所謂也有得也有失者也太平胸襟如山之高海之濶恰似不曾聞見一樣高菴見堂頭顏色不變乃疑而詢之行者方知是水虀菜焉葢因佛鑒舊有脾胃之病不喜食油故別置淡虀菜耳高菴自愧其錯發此言乃上方丈辭軄佛鑒乃以愛語三昧調御之曰維那所言極甚當理以惠懃之病故乃如此曾聞古聖人云以理通諸礙今維那以當理之言通達我所食不強于眾以聞于大眾更有何礙大眾凡所疑者皆不疑矣維那志向氣骨高明廣遠他日當牚支法席如磬石之安有日子在幸勿以今日之言而自鯁逆也及佛鑒遷主智海寺維那過龍門遂嗣法于龍門佛眼焉鯁音梗謇諤音蹇噩咈音佛拙菴曰大凡與官員論道酬酢須是剗去知解勿令他坐在窠窟裏直要單明向上一著子妙喜先師嘗言士大夫相見有問即對無問即不可又須是個中人始得此語有補於時不傷住持之體切宜思之拙菴曉住持人接納宰官要存大體說大凡主法者與官員論評此事一酬一酢時須是言中有響句裏藏鋒剗削蠲去他的心知意解莫要令他墮在葛藤窠狐疑窟裏唯貴直捷單提撥轉向上關棙這一著子妙喜先師曾有言未出仕之士及已出仕之大夫相會時凡有所問不可不對若無問又不可勉強應對又須是個中人始可與他說個中話先師此語正有補益於今時不損失主法人的大體切宜深思詳味之毋自輕也拙菴曰地之美者善養物主之仁者善養士今稱住持者多不以眾人為心急己所欲惡聞善言好蔽過惡恣行邪行從快一時之意返被小人就其好惡取之則住持之道安得不危乎與洪老書好惡俱去聲過惡之惡入聲拙菴曉住持人當善養士以保法門說地土豐腴膏美者必竟能生長好物主人仁愛慈柔者必竟能鞠育好士今之稱住持者多因他沒有仁愛大眾的念頭詎肯以眾人心膓為自己的心膓耶唯以自己所好為急務有好善言不愛聽聞凡己過惡極力遮掩凡是邪行任意恣行徒但縱快一時之意返被小人乘其縫罅就他所好所惡任便而取則住持之道一定危也安能長保而不危乎可見主法者宜善養士也罅鰕去聲拙菴謂野菴曰丞相紫巖居士言妙喜先師平生以道德節義勇敢為先可親不可疎可近不可迫可殺不可辱居處不淫飲食不溽臨生死禍患視之如無正所謂干將鏌鎁難與爭鋒但虞傷闕耳後如紫巖之言幻菴記聞溽音肉淫流蕩也溽恣滋味為溽溽之言欲也干將是造劍之匠鏌鎁是干將之妻楚王命造劍三年乃成雌雄二劍干將隱雄獻雌王秘匣中時有悲聲以問羣臣臣曰劍有雌雄此雌憶雄耳王怒干將知罪必死藏劍于柱囑妻曰日出北戶南山有松松生石上劍在其中妻後生子眉間赤長成問母父何在母述前事剖柱得劍欲報父讎而不得俄有客曰吾甑山人能為子報父讎眉間赤曰客何所須客曰但得子頭并劍以進赤自刎頭與客客得頭與劍進王王曰大幸客曰願王以油烹此頭三日不爛客請王視客以劍揮王頭落鼎中兩頭相嚙客恐赤不勝乃自刎頭助之俄三頭俱爛干將鏌鎁因此得名比況大慧鋒利的意思虞憂也闕損也拙菴謂璇野菴言人頴鋒不可太露說張丞相紫巖居士有言妙喜先師平生唯以正理調其心正行修其身身端而有節心正而合義勇猛不屈果敢力行以此六法為先就如那禮儒行言士有可親愛而不可劫奪可近狎而不可逼迫可誅殺而不可凌辱居處不淫蕩飲食不滋溽妙喜之剛毅亦有同於如此者故能臨生死禍害交加于前看之如無所有一樣雖然如是正所謂干將鏌鎁鋒利太過固難與比竝爭勝但恐有不測之虞損傷闕壞焉耳後果如紫巖居士之所說其士人德行剛毅不及大慧者不可以不謹也拙菴曰野菴住持通人情之始終明叢林之大體甞謂予言為一方主者須擇有志行衲子相與毗贊猶髮之有梳面之有鑑則利病好醜不可得而隱矣如慈明得楊岐馬祖得百丈以水投水莫之逆也幻菴集拙菴曉住持人要得好人輔助說野菴住持善于用人儘得人情而有始有終又能明識叢林大方體裁嘗謂予有云為一方設化之主須選擇有志力廣大能攝能行諸菩薩行的衲子相與輔毗贊助譬如頭髮得梳而紊亂可理面目有鏡而美惡可知一樣則叢林中襍糅利害清濁好歹一一顯然自不可得而隱匿矣又以正理喻之就如慈明圓祖之得楊岐會監司馬祖之得百丈海侍者一般此皆心心相印空合空水投水誰得而違逆之哉此皆師資得人之實德實効也糅音柔上聲拙菴曰末學膚受徒貴耳賤目終莫能究其奧妙故曰山不厭高中有重巖積翠海不厭深內有四溟九淵欲究大道要在窮其高深然後可以照燭幽微應變不窮矣與覲老書膚淺也言在皮膚不深也四溟即東西南北四海也淵止水也水盤旋處為淵九淵列子鯢旋之潘為淵止水之潘為淵流水之潘為淵濫水之潘為淵沃水之潘為淵氿水之潘為淵雍水之潘為淵汧水之潘為淵肥水之潘為淵是為九淵拙菴曉學人欲實為生死必須討個底蘊說末世學者見事淺近入耳過眼不肯留心徒或貴耳賤目或貴目賤耳到底不能窮究其極致故舊有云山不厭高愈升而愈高若厭其高安知重巖積翠之幽趣水不厭深愈入而愈深若厭其深安知四溟九淵之波瀾欲要極盡無上大道須是不厭其高深而敏勉力行精進不已一定要到至高至深之處然後可以照徹幽深洞燭隱微而應變無窮矣學者可不盡心乎鯢音倪潘音盤氿音癸汧音牽拙菴謂尤侍郎曰聖賢之意含緩而理明優游而事顯所用之事不期以速成而許以持久不許以必進而許以庶幾用是推聖賢之意故能亘萬世而持之無過失者乃爾幻菴集亘通也拙菴謂尤延之聖賢道學貴持久說得一切智之聖行解相應之賢的意旨貴含緩舒遲而道理明白優游自如而庶事彰顯凡所運用之事不倉卒期望以速成立而惟許持之久遠不苟且許其必銳進而惟許其不退差近于道焉用此以推廣得一切智聖人行解相應賢者意旨所以能綿亘萬世而持守之保其身業語業意業咸無過失者乃能如斯耳其他孰許之焉惟聖賢與聖賢乃能知之也侍郎尤公曰祖師已前無住持事其後應世行道迫不得已然居則蓬蓽取蔽風雨食則麤糲取充饑餒辛苦憔悴有不堪其憂而王公大人至有願見而不可得者故其所建立皆磊磊落落驚天動地後世不然高堂廣廈美衣豐食指如意於是波旬之徒始洋洋然動其心趦趄權門搖尾乞憐甚者巧取豪奪如正晝攫金不復知世間有因果事妙喜此書豈特為博山設其拈盡諸方自來習氣不遺毫髮如飲倉公上池之水洞見肝腑若能信受奉行安用別求佛法見靈隱石刻蓽音必糲音賴磊雷上聲趦音雌趄音疽攫匡入聲蓬蓬戶也蓽蓽門也織荊為門俱表儉約而不奢的意思餒饑也憔憂患也悴憂也磊落魁礌貌又如轉石自高而下無所阻礙也比況有道者行事縱橫自在的意思指言動指麾皆如所欲也洋洋盛大貌音義註流蕩之貌宜徉取彷徉徘徊徙倚形容小人覬覦之狀似近理方與下文貫趦趄行不進貌攫爪持也倉公長桑君教扁鵲服上池之水三七日視垣墻不隔又盡見人五臟癥結盡得桑君神聖功巧之道餘詳音義侍郎尤延之惜佛道之衰引妙喜書以診庸僧之病說祖師已前原沒有住持之事其後應化世間流行此理迫不奈何猶未聚眾而閒居獨處則誅茆作戶編荊為門但取遮障風雨耳日用飯食粗而不精粟僅脫粃但取填補饑瘡耳辛苦而勤憔悴而慮誠有不堪其憂而國王三公侯伯大人有望仰欲願見而不可得者以此之故或因時建立門庭攝化眾生皆磊磊無礙落落不羈發一言出一令行一事無不驚天動地暨至于今全不合古蓬戶蓽門而易為高堂廣廈粗蔬脫粟而易為豐衣美食辛苦憔悴而易為指如意于是俾波旬外道徘徊徙倚萌動妄想起無厭貪心靠他墻籬傍人門戶如失家之狗搖頭擺尾乞其憐惜不特此也更有甚焉設巧以取恃豪而奪就如那齊人欲金而衣冠往市至于鬻金之所攫金而去主捕得問曰人皆在此子何攫人金也曰正當攫時不見有人此所謂見財無恥見利忘害這樣人正同乎此那裏更知有因有果生王法死地獄之事以上乃妙喜與博山書言也用此而觀妙喜此書豈特為博山長老設其拈除十方從來積弊習染不差毫釐正恰于時者也譬如飲桑君上池之水而自己心開意朗自見肺肝亦見他人肺肝一般若信而讀讀而誦誦而受持奉行即此便是潤焦醍醐上味即此便是刺除膏肓金鍼也何用別求佛法哉肓音荒侍郎尤公謂拙菴曰昔妙喜中興臨濟之道於凋零之秋而性尚謙虗未嘗馳騁見理平生不趨權勢不苟利養甞曰萬事不可佚豫為不可奢態持葢有利於時而便於物者有其過而無其功者若縱之奢佚則不濟矣不肖佩服斯言遂為終身之戒老師昨者遭遇主上留宿觀堂實為佛法之幸切冀不倦悲願使進善之途開明任眾之道益大庶幾後生晚輩不謀近習各懷遠圖豈不為叢林之利濟乎然侍者記聞中興廢而復興也佚豫安樂也奢侈也態情態猶言做樣子的意思便宜也不肖尤公自謂也侍郎尤公表妙喜謙德以勵拙菴莫倦悲願說昔妙喜屢承詔命數遷大剎中興臨濟之道于凋敗零落之秋而其所稟素性崇淳尚朴謙下自養虗心受善總不仗道馳騁自負見識道理一生以來不趨謁權官勢府不苟求財利奉養嘗言世間萬事宜勤勞為不可以安樂為宜儉節持不可以奢態持正有利於今時而順便于事物者不可不知若是有三業不淨之過而無正勤之功者放縱奢侈惟求安逸必不濟矣不肖佩帶服膺此說念念持守以為一生之戒老師昔日蒙遇聖上殊恩遲留七宿內觀堂誠為佛祖法門中的福慶更望誨人不倦勤施四無量心廣行四弘誓願使四眾雲歸進善之道寬濶明了而不迷八方集荷眾之心究竟如空而不隘庶幾乍入後生新戒晚輩各自捨除習染下劣之心各自開發大乘久遠之志如此寧不為法門中大利益大舟楫也乎音君密菴傑和尚曰叢林興衰在於禮法學者美惡在乎俗習使古之人巢居穴處㵎飲木食行之於今時則不可也使今之人豐衣文采飯粱囓肥行之於古時亦不可也安有他哉習不習故夫人朝夕見者為常必謂天下事正宜如此一旦驅之就彼去此非獨生疑而不信將恐亦不從矣用是觀之人情安於所習駭其未見是其常情又何足怪與施司諫書密菴名咸傑應菴華祖嗣也密菴和尚發明禮法主叢林所習安大眾說叢林之或興或衰必竟何因而致因于禮儀法度之行則興不行則衰耳學者之有美有惡必竟何因而致因于風俗習學之良則美不良則惡耳設使上古之人架巢而居鑽穴而處㵎泉而飲木果而食行之于而今時節則可乎決不可也設使而今之人素縑其衣朱繡其采膏粱其味肥膩其口行之于上古時節則可乎亦不可也安有別樣道理哉在人近習不近習是這個緣故也夫人朝也見夕也見此乃常理人人必謂凡天下事應當如是忽一旦強勉驅迫令他舍此趨彼不惟生疑惑而不信向只怕他亦不肯依從矣用此個道理看來人之性情常所習者自然安之而不疑素所未見者瞥然見之而驚異此該是人一定常情不足以為怪也縑音兼繡音秀密菴謂悟首座曰叢林中惟浙人輕懦少立子之才器宏大量度淵容志尚端確加以見地穩密他日未易言但自韜晦無露圭角毀方瓦合持以中道勿為勢利少枉即是不出塵勞而作佛事也與笑菴書懦弱也韜藏也晦不明也韜晦言當陸沉的意思密菴勉悟首座宜韜光晦跡務守中道說叢林中惟越人軟弱少能特立今子有根力之才助道之器含宏廣大有溟海之量虗空之度淵納包容志氣高尚身端行確加以見明地理穩實綿密他時一定成個好人未易輕言第宜韜光儉德晦蹟含章不顯所重毋露所長毀圓為方合方為圓毋偏一邊務合中道勿妄萌動聲勢利名一毫曲求之心韜即是顯守即是行窮即是通何更用出塵勞而始作得佛事也乎隨寓而安無不裕如也密菴曰應菴先師嘗言賢不肖相反不得不擇賢者持道德仁義以立身不肖者專勢利詐侫以用事賢者得志必行其所學不肖者處位多擅私心妬賢嫉能嗜慾苟財靡所不至是故得賢則叢林興用不肖則廢有一于斯必不能安靜見岳和尚書妬都去聲嫉妬害賢曰嫉害色曰妬密菴和尚曉岳長老當具擇法眼識君子小人說應菴先師嘗言有德君子無德小人兩相違反不可不揀賢智君子惟常守此遍通之道濟眾之德如慈之仁當理之義以成立此身不肖小人惟專務此恃仗權勢欺取財利詭詐其行便侫其口以用行己事賢德君子若得遂其志向必行其所守之學專利于人不法小人一處高位多自擅主一己私心妬害賢人嫉忌能士口貪意邪身循財利三毒十惡無所不為是故得賢人則法社自興用一愚人則法社必廢這樣小人詎可令有一于此哉若其有一擾攪大眾必竟不得安靜何也眾君子成之不足一小人壞之有餘也密菴曰住持有三莫事繁莫懼無事莫尋是非莫辯住持人達此三事則不被外物所惑矣慧侍者記聞莫不可也密菴和尚謹住持人要達三莫之理說住持有三不可一凡百事宂繁堆堆叠叠打屏不開不可懼他二凡沒得事務清清淨淨恬然自定不可尋他三凡是非到來好好歹歹一切任之不可辯他住持人通達此三不可之事理者則自然不被外物之所感亂而我自有一定主宰矣密菴曰衲子履行傾邪素有不善之迹者叢林互知此不足疾惟眾人謂之賢而內實不肖者誠可疾也密菴曉人當深知險惡小人難得辯識說衲子尋常行履不甚端莊正直原有惡迹之人廣眾盡知此人不足疾憾他惟是人人都說他是個好人而心中險于山川念念不肖這樣人誠可疾惡也密菴謂水菴曰人有毀辱當順受之詎可輕聽聲言妄陳管見大率便侫有類邪巧多方懷險詖者好逞私心起猜忌者偏廢公議葢此輩趨向狹促所見暗短固以自異為不羣以沮議為出眾然既知我所用終是而毀謗固自在彼久而自明不須別白亦不必主我之是而訐觸於人則庶可以為林下人也管見小見也險詖不平之言也猜忌疑怨也沮止也訐斥人隱惡攻人陰私密菴和尚與水菴書人要以忍辱修德為主說設人有毀謗辱詈于我者當順人之意而忍受之不可纔觸衰風被他搖撼而妄陳小見恐傷法體大率便之人必有儻類邪巧之輩心術多端胸懷不平者好逞自己一偏之私心起生疑怨者偏廢眾人公道之議論葢這樣人之所趨向狹小促隘其所見處暗昧短淺固執己見與人不同為出乎其類也剛愎自用專沮僉議為拔乎其萃焉倘然既知我所運用者必竟為是而毀訾謗辱者本自在彼是非經久不辯自明何須勉強分皂別白更不必堅強主定自家個是而攻訐他短觸發人私但自堅正其體平等其心則刀割香塗不生嗔喜庶幾為林下一人也自得輝和尚曰大凡衲子誠而向正雖愚亦可用而懷邪雖智終為害大率林下人操心不正雖有才能而終不可立矣自得輝名慧輝天童正覺嗣也自得和尚與簡堂書凡用人貴端正說大凡衲子胸中誠懇而所趨端正雖愚魯鈍拙亦是可用的若是口頭便而心中私邪雖聰明黠慧畢竟是作彗的總而言之林下人操心一定要端正若不端正縱有才力能幹而到底不可成立矣自得曰大智禪師特剏清規扶救末法比丘不正之弊由是前賢遵承拳拳奉行有教化有條理有始終紹興之末叢林尚有老成者能守典刑不敢斯須而去左右近年以來失其宗緒綱不綱紀不紀雖有綱紀安得而正諸故曰舉一綱則眾目張弛一機則萬事隳殆乎綱紀不振叢林不興惟古人體本以正末但憂法度之不嚴不憂學者之失所其所正在於公今諸方主者以私混公以末正本上者苟利不以道下者賊利不以義上下謬亂賓主混淆安得衲子向正而叢林之興乎隳音灰弛者弛廢不遵禮度也隳毀也賊貪也自得和尚與尤侍郎書論法門之興全在行禮法說大智和尚特剏清規者何葢謂維持援救末法來比丘等不端正之積弊也由是前有德業者遵依承戴拳拳服膺佩奉修行上不失大體而有教化下不失廼職而有條理在先者如是開張而有始在後者亦如是依行而有終宋紹興末法社之中尚猶有老成練達之士能競競業業持守先聖典刑不敢頃刻弛廢而舍離左右近年以來一時不如一時一世不如一世失其綱宗紀緒主法之綱全無而不成綱眾理之紀盡棄而不成紀縱使再有大智的禮法烏可得而整勅之故所以說主法者能舉一綱則眾人之條目自然施張若主法者懈弛一機則事事法法亦隨之而隳頹寧不危乎綱紀典刑顛覆而不振揚也叢林剎竿倒地而不興起也惟是古人身體力行正其根本枝末自然亦隨之而端正但恐法制禁令之不得嚴厲不慮後昆晚進之不得其所其所以正之者在何在于公平正直而不私心偏邪今諸方主法者全是以私心而廢公議假公事以濟私情顛倒參差反本覆末上者苟求利養違道以干譽下者阿諛取容貪利以失義上驕奢下侮瀆而謬亂矣賓嫌疑主嫉惡而混淆焉如此豈得衲子趨向正道而叢林永久興盛也乎予以為必不得也自得曰良玉未剖瓦石無異名驥未馳駑駘相雜逮其剖而瑩之馳而試之則玉石駑驥分矣夫衲子之賢德而未用也混於稠人之中竟何辯別要在高明之士以公論舉之任以軄事騐以才能責以成務則與庸流迥然不同矣瑩音榮自得和尚與或菴書當善舉賢任能說無瑕良玉未曾剖判之時誠然與瓦石有何分別遺風名驥未曾馳試之時誠然與駑駘混雜有何分別及其石剖而玉瑩馬馳而驥識則玉是玉石是石駑是駑驥是驥即自分明矣夫衲子之有賢才有德行而未發用者混雜于廣眾之間究竟莫能辯別孰好孰歹貴在高明遠見之哲人以公正議論而舉揚之專任以當道軄事勘驗其才力智能委責以必成事務則眾機理而萬化行一德孚而明良會與庸流之類迥然不同矣所以瓦石駑駘剖試而玉驥自現賢才一舉而庶事必康也駑駘音奴台或菴體和尚初參此菴元布袋於天台護國因上堂舉龐馬選佛頌至此是選佛場之句此菴喝之或菴大悟有投機頌曰商量極處見題目途路窮邊入試場拈起毫端風雨快遮回不作探花郎自此匿迹天台丞相錢公慕其為人乃以天封招提勉令應世或菴聞之曰我不解懸羊頭賣狗肉也即宵遁去或菴名體護國景元之嗣也布袋此菴混名也丞相錢公名相祖字象先問道於或菴也解會也遁隱遯也記或菴體和尚初參此菴元布袋子天台護國寺之時因元和尚上堂舉龐居士問馬祖不與萬法為侶者是甚麼人祖云待汝一口吸盡西江水即向汝道士于言下大悟呈偈云十方同聚會個個學無為此是選佛場元和尚舉至此意謂主考已出棘門已開丹霞舉子胡為不入乃衝口一喝如探竿影草而誘致之或菴猶如陶家挂壁之梭長房葛陂之杖得震得地即乃變化升騰而去不覺于此喝下大悟此所謂因風吹火費力不多也遂乃呈投機頌曰商量極處見題目眼花不少途路窮邊入試場墮坑落壍拈起毫端風雨快莫妄想這回不作探花郎有主考在自此投機得法之後守道義惜名節而嘉遯入天台焉丞相錢象先心中愛慕高其為人乃以天封寺常住請他出世化導眾生或菴聞得錢公來請乃笑曰我不會做假外面彰顯羊頭以欺人而內案所賣者實狗肉也即自鞏固其志不為天封名位所惑而宵遯去矣乾道初瞎堂住國清因見或菴讚圓通像曰不依本分惱亂眾生瞻之仰之有眼如盲長安風月貫今昔那個男兒摸壁行瞎堂驚喜曰不謂此菴有此兒即遍索之遂得於江心固於稠人中請充第一座天台野錄乾道宋孝宗年號瞎堂靈隱住持名慧遠圓悟勤祖嗣也記乾道初瞎堂住國清寺之時因見或菴讚觀音菩薩畫像云不依本分大巧若拙也惱亂眾生大仁不仁也瞻之仰之注望而心慕也有眼如盲圓通之像或男或女或威或慈瞻仰之者雖然有眼覰之恐有所不及寧不如盲耶長安帝都遐邇歸赴風景月色貫古通今盡世黠慧者只知以此為樂地耳是那一個男子漢大丈夫肯向這壁頭上捫摸行持若肯向此捫摸行持管取與圓通大士同一眼見同一耳聞去在瞎堂一見此讚且驚且喜曰不意此菴有此好克肖之子耶即遍尋求之遂得于焦山就于廣眾中請充補人天首座以為後昆眼目焉或菴乾道初翩然訪瞎堂於虎丘姑蘇道俗聞其高風即詣郡舉請住城中覺報或菴聞之曰此菴先師囑我他日逢老壽止今若合符契矣遂欣然應命葢覺報舊名老壽菴也虎丘記聞記或菴乾道之初訪候瞎堂遠和尚於虎丘姑蘇緇而道人素而士庶聞或菴高操之風即詣通郡守迎請住持城中覺報寺或菴聞之喜曰此菴先師囑我他時異日時節到來逢老壽止今日之請正與先師之囑若竹符相契合矣遂欣欣然而臨應蘇城郡守并緇素等人之命葢覺報寺當時原名老壽菴也至人讖囑不爽如是或菴入院後施主請小參曰道常然而不渝事有弊而必變昔江西南嶽諸祖若稽古為訓考其當否持以中道務合人心以悟為則所以素風凌然逮今未泯若約衲僧門下言前薦得屈我宗風句下分明沈埋佛祖雖然如是行到水窮處坐看雲起時由是緇素喜所未聞歸者如市語錄異此記或菴入老壽院後士夫請小參曰聖賢之道綿亘十方而不易貫通三世而不改世間之事士趨于名而必求民趨于利而必貪以此弊故而聖賢之道變也昔江西馬祖南嶽石頭諸祖惟稽考往古而成訓誡驗其可否以定綱宗持守中道不偏不倚直指人心只教自悟所以淳素之風凜然猶在從古至今綿綿未泯至于衲僧門下未開口之先薦得此理猶為屈辱我的宗風言句之下了了分明早已無端淪沒佛祖雖爾人人本具各各現成也必竟要真踐實履行到那水也窮山也盡之處全身放下兩眼大開看看風從何來雲從何起一定有個來由也因此之故緇流慶悅士庶騰懽喜聞希有四眾來歸就如閙市一樣或菴既領住持士庶翕然來歸衲子傳至虎丘瞎堂曰遮個山蠻杜拗子故拍盲禪治你那一隊野狐精或菴聞之以偈答曰山蠻杜拗得能憎領眾匡徒似不曾越格倒拈苕帚柄拍盲禪治野狐僧瞎堂笑而已記聞拗于教切翕聚也杜拗不依軌轍曰杜不順人情曰拗拍拊也言自不能行拊人肩而行也隊羣也匡正也記或菴既領老壽住持士庶競進翕然而來歸依者眾有人傳說到虎丘瞎堂聞得乃喜而戲言曰這個山蠻杜拗子不通人情不曉禮法恁他放拍盲禪只好治你們一夥野狐精耳濟得甚事這樣說話教做格外之談全不在言句上雖曰戲謔其實乃稱贊羨美他的好處或菴聞之以偈答于虎丘曰山蠻杜拗得能憎有人嫌在領眾匡徒似不曾圭角已露越格倒拈苕帚柄放下著拍盲禪治野狐僧師子吼時芳草綠瞎堂笑而已象王行處落花紅季而拖藁至此問傍僧云且道判著判不著傍僧乃笑師云真師子兒善能哮吼或菴謂侍郎曾公逮曰學道之要如衡石之定物持其平而已偏重可乎推前近後其偏一也明此可學道矣見曾公書或菴謂侍郎曾公逮學道要持平說造詣此道之極要譬如天平衡石之較一切物輕重一般惟是持其平準而已偏于重的一邊可乎不惟輕不得較就是重亦不得而較之也偏于輕也是一樣前也不可後也不可其偏也是一樣明此持平之理者可以為真正學道之人矣或菴曰道德乃叢林之本衲子乃道德之本住持人棄厭衲子是忘道德也道德既忘將何以修教化整叢林誘來學古人體本以正末憂道德之不行不憂叢林之失所故曰叢林保於衲子衲子保於道德住持無道德則叢林廢矣或菴與簡堂書見王法人當知叢林根本說空無作無相之道布施愛語利同之德乃叢林之根本英人哲士又乃道德之根本主法人若厭棄英哲之士則是忘失三脫四攝之德道也三脫四攝之道德既是忘失將甚麼去興揚法道利度眾生整頓叢林誘引後輩古人惟是體認根本以正枝末只憂慮的是三脫道四攝德之不行不憂慮叢林之得所不得所故所以說叢林保護衲子衲子保護道德兩相保也主法人詎可無三脫四攝之道德耶無則叢林必廢無疑矣或菴曰夫為善知識要在知賢不在自賢故傷賢者愚蔽賢者暗嫉賢者短得一身之榮不如得一世之名得一世之名不如得一賢衲子使後學有師叢林有主也與圓極書或菴曉為知識者貴得賢人說夫傳道之人先要認得有德好人為第一義不在只圖自家個好也故所以說傷賢的人教做愚蠢之人蔽賢人的人教做暗昧之人嫉賢人之人教做短淺之人倘得一身之榮顯不及得一生之美名更美也得一生之美名又不如得一明心見性有道有德的賢衲子更為嘉美也何也使後來學者有真師承叢林有真主法也故善知識貴得賢矣或菴遷焦山之三載寔淳熈六年八月四日也先示微恙即手書并硯一隻別郡守侍郎曾公逮至中夜化去公以偈悼之曰翩翩隻履逐西風一物渾無布袋中留下陶泓將底用老夫無筆判虗空行狀泓胡盲切悼哀傷也陶泓硯名也底何也記或菴再遷焦山幾三載正是宋淳熈六年八月朔四日也將入滅預示微疾即親手作書并硯使人通書辭潤州曾公逮侍郎至子夜告眾跏趺而逝及次早曾公至見已化去乃作偈傷悼之曰翩翩隻履逐西風比況如同達磨隻履翩翩西逝一般也一物渾無布袋中直言焦山脫謝乾盡皮袋子中了無一物也留下陶泓將底用言焦山臨行遺留此硯與我將作何用也老夫無筆判虗空此曾公自謂我老夫無筆空拳赤手焦山末後光明葢天葢地如同虗空一般不可思議誠難判斷也季而謂或菴始從此菴喝下悟入隱跡天台錢象先勉應天封宵夜遁去瞎堂得之江心應緣符于老壽領眾拈苕帚隻硯別曾公誠哉越格衲僧可謂頭正尾正也瞎堂遠和尚謂或菴曰人之才器自有大小誠不可教故楮小者不可懷大綆短者不可汲深鴟鵂夜撮蚤察秋毫晝出瞋目之不見丘山葢分定也昔靜南堂傳東山之道頴悟幽奧深切著明逮應世住持所至不振圓悟先師歸蜀同範和尚訪之大隨見靜率略凡百弛廢先師終不問回至中略範曰靜與公為同參道友無一言啟廸之何也先師曰應世臨眾要在法令為先法令之行在其智能能與不能以其素分豈可教也範頷之虎丘記聞鴟音笞鵂音休撮竄入聲楮穀木也皮可紙綆井繩也楮小綆短言才小器淺的意思鴟鵂怪鳥也晝無所見夜出嘬蚊言見小的意思靜南堂名元靜東山演祖嗣也頴錐鋩也頴悟言脫頴而出的意思記瞎堂遠和尚謂或菴應世才器要遠大更又要以法令為先說人之才力器量本自也有大的也有小的誠不可教誡者故楮紙之小者豈可懷裹大物繩索之短者怎能汲得深泉鴟鵂怪鳥夜能嘬取蚊蚤明察秋毫之末至于日出白晝大瞋兩目而不見眼前丘山此非不可教之素分而何拘理如是也昔南堂元靜見東山演祖會盡古今公案脫悟超邁洞達幽奧精深切當彰著明了祖印之曰諸方關楗無逃子掌握矣及其出現世間所到不能振起圓悟先師自南還歸成都同範和尚相訪于大隨山中見靜草率忽略凡叢林規矩盡該弛廢先師知其才器如此究竟不吐一言回至中途範問先師云靜與公為同門契分共師五祖之道故相友于者怎不吐露一言啟發謹廸之何也先師答範和尚曰夫出世利生以臨廣眾貴在以法度禁令為先務法令所施又要以智慧為前矛才能為殿後智先能後所以成始而成終也今靜能終不能終是其他之素性分定使然他非不知乃不能行也我安得而教之哉範會其不啟廸之故乃默而識之嘬釵去聲瞎堂曰學道之士要先正其心然後可以正己正物其心既正則萬物定矣未聞心治而身亂者佛祖之教由內及外自近至遠聲色惑於外四肢之疾也妄情發於內心腹之疾也未見心正而不能治物身正而不能化人葢一心為根本萬物為枝葉根本壯實枝葉榮茂根本枯悴枝葉夭折善學道者先治內以敵外不貪外以害內故導物要在清心正人固先正己心正己立而萬物不從化者未之有也瞠堂與顏侍郎書學道貴正心正身說專務此理的人先要洗滌自己之心令無一毫染污然後可以正己而正乎人自己心正不妄與自己身正不偏則事事法法咸安定而不亂矣未聞心理而身不治者諸佛諸祖之教法先由內一心而後外及一身自目前咫尺而以達于千里六塵聲色利養惑亂于外此乃四肢之外疾也三毒妄想情慮陡發于內此乃心腹之內疾也未見有心不邪曲而百物不治身體端莊而人不來歸化者葢一心為人主宰猶木之有根荄本幹眾物為枝枝葉葉一樣根荄本幹既然壯實則枝枝葉葉自然榮茂盛美若是根荄枯乾本幹憔悴枝枝葉葉一定凋傷敗落善能專務此理的人全是先修治一心妄想以抵敵六塵聲色不貪愛六塵以戕害一心所以利物指迷貴在清淨一心規正于人本先規正自己心既端正而萬人一心已既成立而百物條理有不從其教化者耶斷斷乎未之有也簡堂機和尚住番陽筦山僅二十載羮藜飯黍若絕意於榮達嘗下山聞路旁哀泣聲簡堂惻然逮詢之一家寒疾僅亡兩口貧無斂具特就市貸棺葬之鄉人感歎不已侍郎李公謂士大夫曰吾鄉機老有道衲子也加以慈惠及物筦山安能久處乎會樞密汪宣撫諸路達於九江郡守林公虗圓通法席迎之簡堂聞命乃曰吾道之行矣即欣然曳杖而來登座說法曰圓通不開生藥舖單單只賣死貓頭不知那個無思算喫著通身冷汗流緇素驚異法席因茲大振簡堂名行機護國景元之嗣也番陽饒州鄱陽縣也筦山地名藜落藜也小可食大可杖斂具指棺槨說貸賒借也樞密都察院也宣撫巡按也死貓頭公案也僧問曹山世間何物最貴山云死貓頭最貴記簡堂和尚在鄱陽筦山之時且廿年之久羮用藜藿飯用黍粟似若絕念于世間不求通達于當路曾下山聞得路旁人家有哀泣之聲簡堂慈心三昧忽然現前乃躬躡憐而問之答言時因寒病且死兩人家中窘極無收斂之棺具堂乃就市貸借棺具埋葬之彼一鄉之人無不感服稱贊不止侍郎李春年遍告諸未仕之士及已仕大夫而言之曰吾鄉機和尚誠然有道的衲子也加以有惻隱之慈周急之惠以及于人筦山狹小詎可長久稽遲以處此乎暨宋南渡後值明遠汪察院宣通諸郡道路達之于九江府郡守林公叔達遂虗圓通禪院以迎請之出世簡堂聞請乃曰吾道之行矣自知時至即欣然不辭而來當入院日緇素士夫請登座說法曰圓通不開生藥舖不以小乘法濟度于眾生也單單只賣死貓頭惟此一事實餘二則非真也不知那個無思算惟身語意業無過失者始能懸崖撒手自肯承當也喫著通身冷汗流絕後再甦欺君不得也緇而衲僧素而士庶聞者莫不驚奇歎異法化因茲而大振起之焉韜光蓄德時至理彰是這等樣後學之則也簡堂曰古者修身治心則與人共其道興事立業則與人共其功道成功著則與人共其名所以道無不明功無不成名無不榮今人則不然專己之道惟恐人之勝於己又不能從善務義以自廣也專己之功不欲他人有之又不能任賢與能以自大也專己之名不與他人共之又不能謙光導物以自達也是故道不免於蔽功不免於損名不免於辱此古今學者之大分也簡堂曉學者當識大體公分說古之學者裁制其身調伏其心己既曉了則與人說公共其道而不自私焉事既興隆業已樹立非我獨辦則必眾力公共其功而不自居焉道既成就功亦彰著既有此譽則必讓人公共其名而不自處焉是故道不獨明而無一人不明功不獨成而無一人不成名不獨榮而無一人不榮今之學者則不然縱使學道專務自利不肯利人惟怕人知勝過于己又不肯虗心受善扣長勵短務合時宜以自廣濶也設使立功專務掩人以為己有不喜他人半點有之又不能卑心下賢任能贊佑溫厚和平以自寬大也設使名遂專務自顯不與人共見人有譽反不歡喜又不能謙恭蓄德和光同塵導引愚迷以自通達也所以道本求明而反自蔽功本求成而反自損名本求榮而反自辱此兩者乃古乃今學者不易之大體公分也簡堂曰學道猶如種樹方榮而伐之可以給樵薪將盛而伐之可以作榱桷稍壯而伐之可以充楹枋老大而伐之可以為梁棟得非取功遠而其利大乎所以古之人惟其道固大而不狹其志遠奧而不近其言崇高而不卑雖適時齟齬窮於饑寒殆亡丘壑以其遺風餘烈亘百千年後人猶以為法而傳之鄉使狹道苟容邇志求合卑言事勢其利止榮於一身安有餘澤溥及於後世哉榱音催桷音覺齟音阻齬音語榱桷周曰榱齊曰桷即椽也楹柱也枋枅枋也梁棟屋脊柱曰棟負棟者梁齟齬齒一前一却齟齬不相值也比坎坷之意溥廣也簡堂與李侍郎書言學道貴深蓄厚養說學道工夫譬如蒔種樹木纔正榮長而砍伐之但可以供給樵薪備炊㸑之用將茂盛而斫伐之亦可以作造榱桷備葢苫之用稍壯固而斫伐之又可以充具楹枋備裝修之用至于老大而斫伐之更可以堪為梁棟備殿閣之用學道工夫正類乎此豈不是取功力久遠而其利益倍大乎是這個緣故古之人其于當然之理也又堅固又廣大而不窄狹其心之所之也又永遠又深奧而不淺近其出示言詞也又崇重又孤高而不卑小雖所遭時勢坎坷窘于凍餒危殆死于山林丘壑以其遺留道風餘饒芳烈亘古亘今遞百千年後來之人猶以為矜式而流傳之鄉使古人窄狹其道苟且取容淺近其志阿諛求合卑小其言趨權事勢其利益只榮耀于一身或恐不足安有廣大恩澤普徧及干千萬世之後哉所以道貴蓄養也簡堂淳熈五年四月自天台景星巖再赴隱靜給事吳公佚老于休休堂和淵明詩十三篇送行其一曰我自歸林下已與世相疎賴有善知識時能過我廬伴我說道話愛我讀佛書既為巖上去我亦為膏車便欲展我鉢隨師同飯蔬脫此塵俗累長與巖石居此巖固高矣卓出山海圖若比吾師高此巖還不如記簡堂和尚宋淳熈五年四月自天台山景星巖再赴隱靜寺之請時芾公吳給事致仕逸老於休休堂賡和五柳先生陶淵明詩一十三首以與簡堂和尚送行其一曰我從致仕來休歸山林下已與世間事利祿相疎遠今幸簡師時時而來過我草廬不我遐棄或時同我說道中之話更又喜我讀釋家之書有時師歸巖上我亦備辦膏車油鹽茶米我展我鉢雖與師不同所食蔬餐與師不異到此明知塵勞俗事盡謝而無繫累但願恒久居此巖石間耳此巖原本高妙迥然拔出地輿河圖之上若將比我簡師道德的高妙處此巖還不及他也芾音費我生山窟裏四面是孱顏有巖號景星欲到知幾年今始信奇絕一覧小眾山更得師為主二妙未易言孱顏山高貌二言我生長老山阿窟之中東南西北俱是孱顏高山中有一巖名曰景星欲到之心已多年矣今日到來方見此巖奇絕之極垂眸遠眺羣山俱下也更得簡師為此山之主人山妙人妙豈易以言盡之哉孱音潺我家湖山上觸目是林丘若比茲山秀培塿固難儔雲山千里見泉石四時流我今纔一到已勝五湖遊丘阜也培塿小阜也儔侶也三言我家宅搆居湖山之上眼到之處盡是林木丘山設比此山秀麗我那培塿小阜本難侶并耳此山白雲千里外見何其高也此巖清泉四時不斷何其遠焉昔日五湖遊覽將謂無及孰知今一乍到早已超勝多矣我年七十五木末挂殘陽縱使身未逝亦能豈久長尚冀林間住與師共末光孤雲俄暫出遠近駭蒼黃蒼黃悤遽貌四言我之年已七十五矣如近木梢之餘光將入于地設使身形未死亦斷不能久遠留存尤冀望林間住者何欲與師共樂晚年耳師之此行如孤雲野鶴聊暫出入遐邇士庶驚其未見必定蒼黃窘急也愛山端有素拘俗亦可憐昨守當塗郡不識隱靜山羨師來又去媿我復何言尚期無久住歸送我殘年拘執也五言喜愛山巖本乎情素執拘俗染誠可矜憐昔日營營宦海安知今日隱靜山中之高妙哉猶所羨美者師飄然而來又飄然而去媿我無言可贐只望無久住于彼速速來歸送我死耳師心如死灰形亦如稿木胡為衲子歸似響答空谷顧我塵垢身正待醍醐浴更願張佛燈為我代明燭六言以我推師之心心無其心如死灰一樣更觀其形形無其形如枯木一般以何緣故為衲子之所趣歸因他胸中空豁豁地猶響應空谷耳顧我塵勞垢穢之身正待師之醍醐以為我沐浴見不出色之眼更願張佛之慧燈以為我作智燭也扶疎巖上樹入夏總成陰幾年荊棘地一旦成叢林我方與衲子共聽海潮音人生多聚散離別忽驚心扶疎枝葉茂盛也七言巖林密茂到夏月來總成一片清凉棘刺荊榛入能仁手盡化為選佛場地當斯時也我方出岫與諸禪人共聽海上潮汐之音不憶忽來隱靜之請我自嗟人生聚散雖是常理而喜相逢怕離別之情不由人不忽地驚心也我與師來往歲月雖未長相看成二老風流亦異常師晏坐巖上我方為聚糧倘師能早歸此樂猶未央央盡也八言我與師乍相往來時節雖未久長兩眼相覰固實兩個老人而彼此風流誠亦不同乎常輩師晏坐巖上善說般若也我方為聚糧食輪先轉焉倘師此去誠能早歸此等樂景猶未盡也紛紛學禪者腰包競奔走纔能說葛藤癡意便自負求其道德尊如師葢希有願傳上乘人永光臨濟後九言四方紛紛紜紜學禪之輩腰包頂笠往來奔走口頭上學得些少葛藤意地下便人我自負求道全德備如簡師一般者葢希有矣惟願師之道傳於大乘根器之人俾使永遠不絕以光顯臨濟之道於後世焉負上聲吾邑多緇徒浩浩若雲海大機久已亡賴有小機在仍更與一岑絕全兩無悔堂堂二老禪海內共期待大機號重機名明真玄沙師備之嗣也小機即簡堂行機一岑即圓極岑也堂堂盛也十言鄉邑中染衣之輩甚多漫漫浩浩如雲如海天寧大機雖久已亡賴有小機而今現在況復又有岑公乃是純一全德之人竝無過悔者二老道風堂堂大盛四海之內共相期望焉非泛泛者比矣古無住持事但只傳法旨有能悟色空便可超生死庸僧昧本來豈識西歸履買帖坐禪牀佛法將何恃庸僧即尋常粥飯之流也西歸履達磨御葬熊耳魏武帝使宋雲西域回遇師葱嶺手攜隻履雲問何往師云西天去雲歸告帝帝令起壙唯空棺隻履在耳十一言上古原來無住持之事惟只傳受佛法宗旨若果有能實悟色空之理者便可以超越生死也庸僧暗昧自己本有之道豈識初祖遺留之履哉時衰道喪法出奸生買帖坐禪佛法至此替之極矣將何恃賴乎僧中有高僧士亦有高士我雖不為高心麤能知止師是個中人特患不為爾何幸我與師俱是鄰家子麤略也十二言佛法僧中實在也有高僧吾儒士中實在也有高士我雖不是高士我心大略也能知止何況師乎師是道中有德完人佛也不愛做在特患不屈尊就卑捨珍著垢耳我不審何修而有斯慶我與師生同鄰隱同山道同樂也師本窮和尚我亦窮秀才忍窮心已徹老肯不歸來今師雖暫別泉石莫相猜應緣聊復我師豈有心哉猜疑也忌也復往來行故道也後我字悞疑是爾字十三言師能固守斯窮是個窮和尚我亦固守斯窮是個窮秀才甘窮之心彼此已徹師老我老寧不歸歟今師與我雖暫分別流泉止石本無疑猜此個應緣不過聊且往來焉爾師豈是有心要如此也哉理學名儒道德高僧于此可見給事吳公謂簡堂曰古人灰心泯智于千巖萬壑之間㵎飲木食若絕意於功名而一旦奉紫泥之詔韜光匿迹於負舂賤役之下初無念於榮達而卒當傳燈之列故得之於無心則其道大其德宏計之於有求則其名卑其志狹惟師度量凝遠繼鍾古人乃能棲遲於筦山一十七年遂成叢林良器今之衲子內無所守外逐紛華小遠謀無大體故不能扶助宗教所以不逮師遠矣高侍者記聞紫黑赤色紫泥即印詔書赤土也卒終也給事吳公贊美簡堂能深蓄厚養致使譽播天涯說上古隱士死灰其心泯滅其智深入於千巖萬壑之中渴飲巖泉饑餐木果何嘗有意於功名利祿哉而一旦之間不意而得奉天子紫泥之詔命叢林哲人韜藏其光隱匿其跡陸沉於負舂賤役之下曷常有念於榮名達道而卒爾言下投機承當傳燈之列咸皆得之無心故其證道光大德行宏遠設使計之于有願求之心而得則其名卑而不高其志狹而不廣惟師智度淵深才量豁達凝神鎮靜遠識無方庶克繼續慧命踵襲古人乃得棲息遲留于鄱陽筦山一十七年之久甘守節操遂成法門柱石今之禪人觀其內無實德而不操修外無涵養而競名利宗社遠謀而不圖教門大體而不習所以不能繼持大法不及簡堂師遠矣簡堂曰夫人常情罕能無惑大抵蔽于所信阻于所疑忽于所輕溺于所愛信既偏則聽言不考其實遂有過當之言疑既甚則雖實而不聽其言遂有失實之聽輕其人則遺其可重之事愛其事則存其可棄之人斯皆苟縱私懷不稽道理遂忘佛祖之道失叢林之心故常情之所輕乃聖賢之所重古德云謀遠者先驗其近務大者必謹於微將在博采而審用其中固不在慕高而好異也簡堂與吳給事書兼示人知所重而莫為情所惑說夫人日用尋常觸境動情少有不被其所惑者大凡被惑有四一或聞言入耳不審障于所信二或見事欲為不為滯于所疑三或于人情存我慢略于所輕四或于物極意營求醉于所愛設我耳中聽信既不端正則聽言必意不稽考其理之實與不實遂有過不及之言其惑一也設我心中猜疑彼人太甚則雖彼人所說極當理也是不肯聽他的因此有失實之聽其惑二也設我輕忽彼人則有可尊之事亦必遺棄而不見用其惑三也設我愛好其事則有可當棄之人亦必存留而反用之其惑四也此四者皆苟且放縱私情鄙懷不考公正義理遂遺忘佛祖之大道乖違大眾心膓所以謂尋常人情之所輕略者乃是古聖先賢之所崇重古德有云欲圖謀熟計于遠者先勘驗其近小之作欲專務用力于大者必謹慎于隱微之時且在博采廣覽而審諦運用于中本不在捨近取遠而慕高厭常悅恠而好異也簡堂清明坦夷慈惠及物衲子稍有詿誤蔽護保惜以成其德嘗言人誰無過在改之為美住鄱陽筦山日適值隆冬雨雪連作饘粥不繼師如不聞見故有頌曰地爐無火客囊空雪似楊花落歲窮衲被蒙頭燒榾柮不知身在寂寥中平生以道自適不急于榮名赴廬山圓通請日拄杖草屨而已見者色莊意解九江郡守林公叔達目之曰此佛法中津梁也由是名重四方其去就真得前輩體格歿之日雖走使致力為之涕下詿音卦饘音旃榾音骨柮敦入聲詿誤差謬的意思饘厚粥也榾柮短木寓意也猶言三昧真火的意思自適自得也記簡堂四儀清淨明白胸襟坦蕩平夷仁慈恩惠及于一切衲僧之中稍有差謬過失隱蔽存護保全矜惜以培其德業甞言人人咸有過失在肯改過就是好人住饒鄱筦山之日時當季冬雨之與雪連綿繼作厚粥也不能相接況得飯食乎師恰似不聞見一般故有偈云地爐無火客囊空饑可知也雪似楊花落歲窮寒莫勝焉衲被幪頭燒榾柮吾人以三昧性天為樂也不知身在寂寥中饑寒到此渾忘無有一生以來惟以此理自調暢不苟求榮顯聲名及赴廬山圓通寺請之時單瓢隻杖草鞵而已別無他物見之者無不覩容意銷潯陽太守林公叔達見而歎美之曰此人乃佛法中之津筏橋梁也因此之故名重諸方其行止去就誠得古人體裁格式入寂之日雖尋常走作小廝之輩無不為之痛哭流涕也葢其德感人如此侍郎張公孝祥致書謂楓橋演長老曰從上諸祖無住持事開門受徒迫不得已像法衰替乃至有實封投狀買院之說如鄉來楓橋紛紛皆是物也公之出處人具知之啐同時元不著力有緣即住緣盡便行若稗販之輩欲要此地造地獄業不若兩手分付為佳耳寒山寺石刻楓橋蘇州寒山寺前楓橋也紛紛亂也啐呼聲也食物也言母雞得食鳴羣眾子皆至而食之一呼百喏之意也稗宜裨附也即楞嚴經云裨販如來也言裨附我教法中以佛法貪販利養也侍郎孝祥張公致書謂楓橋演長老當識時務知去就說從上諸祖師原無住持事或開剏山門受納徒眾是迫于不得已像法之時衰替之極乃至有求名結托當道有力宰官轉本以求實封賜額者有求利投托士夫商賈申窘情狀偽賣偽買以罔錢帛者之說這一鄉來楓橋寺中紛紛紜紜角𭪿不已皆是此等輩也公之或出或處領眾行道人咸知之如雞喚雛母啐子一呼百應元不著力到處皆然豈靠此耶有緣即住無緣即撒手便行若這等裨販如來之流要楓橋造地獄業公不若恒順眾生兩手分付實為佳美矣慈受深和尚謂徑山訥和尚曰二三十年來禪門蕭索殆不堪看諸方長老奔南走北不知其數分煙散眾滿目皆是惟師兄神情不動坐享安逸豈可與碌碌者同日而語也欽歎欽歎此段因緣自非道充德實行解相應豈多得也更冀勉力誘引後昆使曹源涸而復漲覺樹凋而再春實區區下懷之望筆帖慈受名懷深徑山妙空名智訥俱長蘆崇信之嗣也索音色宜瑟蕭瑟陰令促急風疾暴也楚辭蕭瑟兮草木搖落比況法門衰替亦如此也殆將也碌碌者指庸流說欽恭嘆美也涸水乾也區區卑小貌謙下的意思慈受深和尚贊美徑山訥和尚神情鎮靜有實德說近世來禪道法門漸漸凋傷殆不堪聞見矣四方的長老自西自東自南自北如稻蔴竹葦分枝列派遍地皆是惟我徑山師兄神凝情定而不動坐享安逸而不遷詎可與諸方碌碌庸輩同日而語也耶敬服敬服此段因緣倘不是見諦真實操修縝密行合解解合行行解相應寧能多得也更所冀望者敏勉力行提持後進使曹溪淵源既乾而復漫涱菩提覺樹既謝而再春榮實區區愚下心懷之所希望也此乃稱揚贊美同門之實德矣靈芝照和尚曰讒與謗同邪異邪曰讒必假謗而成葢有謗而不讒者未見讒而不謗者也夫讒之生也其始因於憎嫉而終成於輕信為之者諂小人也古之人有輸忠以輔君者盡孝以事親者抱義以結友者雖君臣之相得父子之相愛朋友之相親一日為人所讒則反目攘臂擯逐離間至於相視如宼讎雖在古聖賢所不能免也然有初不能辯久而後明者有生而不能辯死而後明者有至死不能辯終古不能明者不可勝數矣靈芝湛然和尚名圓照示人以忍讒息謗說且自問之曰讒憎竝誹謗是一樣是兩樣又自答之曰大率讒憎必借誹謗而始成葢或一味憎惡疑謗于心而不出口讒說者有之至于口上既讒說而心中不憎謗者未之有也夫讒從何起其初因于憎惡嫉忌而卒成乎輕聽如此等人乃諂媚便之人也不特今也上古之人也有為人臣者捐軀赴死而忠君轉國者也有為人子者委曲承順而奉養雙親者也有處朋交友者直諒多聞而結固信義者雖君臣際會而無投竄父子親愛而無奔違朋友親順而不疏戚忽一旦之間為小人所誹讒則父子生瞋反目弟兄鬬諍攘臂君臣直抗擯逐永遠離間直至于君臣父子朋友相看就如宼害冤讎一般雖在上古聖人賢士皆所不能免此小人之誹讒也然或打頭不得分辯久久清白者有之又或在生之日不能分辯到死後而始清白者有之又或至死後亦不能分辯究竟到底亙古亙今不得清白者有之不可勝任以數日之量窮之矣豈特今也耶子游曰事君數斯辱矣朋友數斯疏矣此所以戒人遠讒也嗚呼讒與謗不可不察也且經史載之不為不明學者覧之莫不知其非往往身自陷於讒口噎鬱至死不能自明者是必怒受讒者之不察為讒者之諂也至有羣小至其前復讒於它人則又聽之以為然是可謂聰明乎葢善為讒者巧便鬬搆迎合蒙蔽使其瞢然如為鬼所魅至有終身不能察者子游姓言名偃孔子弟子數頻也斯猶言所以的意思辱對榮言疏對親說噎哽于喉鬱結于心鬬搆是鬬諍搆怨嗚呼嘆辭第二節承上忠君信友來言讒謗之害匪細能令忠信者亦見擯逐離間于君友的意思魯論篇中子游有言承事國君諫諍不可頻數若其多次一旦為小人所讒讒則易入所以有擯逐之禍求榮而反辱矣交處朋友諫諍亦不可頻數若其多次一旦為小人所讒讒亦易入所以有離間之情求親而反疏矣此個說話正所以戒人遠去讒言也芝和尚又復嘆之曰嗚呼此讒謗兩樁不可不深察之也且五經諸史註載未甞不明白學人覧之則謗誹之非未甞不知每每失身自陷于讒人之口哽于喉結于心至于必死田地究竟不得自訴清白者何是乃恚受讒謗小人不肯詳察為讒謗小人者諂使然也更至有眾小人復加讒於他人則其輕聽愈篤如此等輩耳可謂聰目可謂明乎葢專愛做這般讒謗小人偏有許多鬼計亦弄權巧亦假方便鬬搆兩頭逢迎取合昏蒙障蔽使人難見而瞢然就如為魍魎所魅一般所以到底不得察識分疎清白者實可傷矣孔子曰浸潤之譖膚受之愬言其浸潤之來不使人預覺雖曾參至孝母必疑其殺人市非林藪人必疑其有虎間有不行焉者則謂之明遠君子矣曾參孔子弟子名參字子輿第三節承孝親來言讒謗之害非小能令至孝之子亦見疑于賢母的意思昔孔子有言浸漬滋潤以譖毀於人肌膚所受而切訴總言其浸灌滋潤之來不令人先曉所以子輿大賢而極孝母亦明白而最賢人或三譖殺人母亦投杼下機踰垣而走市井之間豈同山林藪澤三個人俱言有虎人亦疑信相半猜其必有間或有決斷不信此等樣說者則可謂之明智有遠識成德的君子矣予以愚拙疎懶不喜諂附妄悅於人遂多為人所讒謗予聞之竊自省曰彼言果是歟吾當改過彼則我師也彼言果非歟彼亦徒為耳焉能浼我哉於是耳雖聞之而口未甞辯士君子察不察在彼才識明不明耳吾孰能申其枉直求知於人哉然且不知久而後明邪後世而後明邪終古不明邪文中子曰何以息謗曰無辯吾當事斯語矣芝園集浼音美文中子姓文名通字仲淹古賢人第四節乃芝和尚自敘忍讒之由引文公息謗以自消弭也余以愚魯拙鈍疎財嬾惰不愛諂媚阿附欺妄取悅于人乃為小人所憎嫉浸潤讒謗余聞得私地自怨自艾而省改之曰彼讒果是真的余當改過遷善彼誠有益于我為責善之師也彼譖言果是假的彼亦空為耳彼焉能浼污我哉因此耳雖熟聞而余口不曾辯訴聰慧之士并成德君子詳不詳也在他才德智識明白不明白耳余誰能理其曲直求人知道哉然且此讒不知久久而自明了耶抑待余死後方始明了耶抑亦究竟始于今日直到盡未來際終不明了耶不見文中有言何以休息誹謗曰無辯此賢哲之論余當奉持此語以自忍矣懶菴樞和尚曰學道人當以悟為期求真善知識決擇之絲頭情見不盡即是生死根本情見盡處須究其盡之所以如人常在家愁什麼家中事不辦溈山云今時人雖從緣得一念頓悟自理猶有無始習氣未能頓盡須教渠淨除現業流識即是修也不是別有行門令渠趣向溈山古佛故能發此語如或不然眼光落地時未免手脚忙亂依舊如落湯螃蠏也懶菴名道樞道場居惠之嗣也示人以真參實悟說為生死的人須是以真實悟入為期限畢竟要尋求真正宗師剖決揀其邪正若是意地下有一微塵許情識見刺不乾淨便就是輪迴六趣生死根荄本榦了直饒情識見刺乾淨淨到無餘之處更要淨而又淨方是極底譬如一個人常常在自家屋裏更愁什麼家中一切事不得了辦你若不信我又引個古聖說話以為證不見溈山靈祐祖道而今時節的人雖是由因緣中稍稍得一念休歇自己馳求之心且猶有無量劫來習染濁氣未曾全釋當令他淨洗目前現業蠲除當體流識就便是修行方法了不是頭上安頭無中生有別討一個行持法門使他趣奔使他向往你看溈山自古迄今人人稱他做古佛此譽不虗非古佛不能開示如斯法語倘如聞而不信設或信又不依行管取四大分張眼光落地之時一定的手也忙脚也亂仍舊似落在沸湯鍋中螃蠏一般誠可惜也季而曾舉學道人乃至事不辦處云懶菴和尚恩大難酬頌云從來此事貴持久剝盡芭蕉更下手悟了還同未悟時甕中怕甚鼈兒走亦附于此祈仁人削正懶菴曰律中云僧物有四種一者常住常住二者十方常住三者現前常住四者十方現前常住且常住之物不可絲毫有犯其罪非輕先聖後聖非不丁寧往往聞者未必能信信者未必能行山僧或出或處未甞不以此切切介意猶恐有所未至因述偈以自警云十方僧物重如山萬劫千生豈易還金口共譚曾未信他年爭免鐵城關人身難得好思量頭角生時歲月長堪笑貪他一粒米等閒失却半年糧律即律部丁寧即諄囑介意存之于心金口金仙之口懶菴和尚諄諄告誡主叢林者當知因識果說律部中有云僧家物事有四般第一般者舍宅田園竹木菜果僕畜米麥之類此乃本常住中之正師住也只許同居現在僧眾受用不得絲毫私己也第二般者寺中供僧成熟飲食體具十方非局本處此乃十方僧眾常住人人有分故也第三般者謂物現前僧現前此物惟施現前僧眾故也第四般者謂亡僧之物體同十方現前十方僧眾俱得分故羯磨後來者不得也此四般常住主人切不可有芥子許侵犯若有犯其過甚重自古諸佛迄今諸祖甚是諄切囑咐每每聞之者未必能篤信設使有信之者未必能依行山僧或出一叢林或處一寺院何常不以此四般常住存之于心臆之間競競業業惟恐有所不到那古聖先賢明因達果田地因而作四句偈二首以自警一曰十方僧物且止不論就是一粒米尚且如山之重設有差處萬劫千生只是償債大難酬還此是大覺金仙親口談說曾無一人肯信他時異日怎麼免得那餓鬼界的鐵門限也二曰六道之中為人最靈易失而難得何不自家好好思忖度量恐一有所差流入畜道披毛戴角之時年月却又長遠可笑有等人貪心無厭不過龜毛之小利如一粒米耳等閒不覺就鑽下地獄之深坑而失却寧止半年之糧飯也可不慎之哉可不慎之哉懶菴曰涅槃經云若人聞說大涅槃一句一字不作字相不作句相不作聞相不作佛相不作說相如是義者名無相相達磨大師航海而來不立文字者葢明無相之旨非達磨自出新意別立門戶近世學者不悟斯旨意謂禪宗別是一種法門以禪為宗者非其教以教為宗者非其禪遂成兩家之說互相詆呰譊譊不能自已噫所聞淺陋一至於此非愚即狂甚可歎息也心地法門譊乃交切達磨菩提達磨香至國王之第二子也在西天為二十八祖東土為初祖懶菴和尚示人當以禪教為一說涅槃經中有云若人聞說大涅槃經甚深法寶或是一句或是一字不作字相是字空也不作句相是句空也不作聞相是聞性空也不作佛相是上無佛道可成也不作說相是下無眾生可利也如是義理諸法空相名無相相却空又不空也達磨初祖自西航海東來面壁嵩山直指人心見性成佛不立文字者葢深明此無相宗旨非初祖杜撰新出己意別立一個法門另開一個戶牖實有由也近代學人不明此個宗旨妄意卜度道謂是禪宗別有一等法則門庭遂爾在禪宗門下者駁其教在教門中者誹其禪遂成禪教二家之說你非我我非你不能無諍且難休息噫如此等輩皆是所見所聞膚淺卑陋以至如斯這等樣不是愚蠢便是狂妄豈不甚可嗟歎太息也耶
